name: Khyrat Telegram Control Center (Legacy Diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Explain legacy workflow
        run: |
          echo "Telegram polling has been replaced by the Cloudflare Worker webhook."
          echo "Use Deploy Khyrat Telegram Control API to deploy/configure the live control plane."
