name: Video Failure Isolation (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  VIDEO_MODULE_ENABLED: "0"

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Disable video module intentionally
        run: echo 'VIDEO_MODULE_ENABLED=0'
      - name: Core import must remain green
        run: python -c "import main; print('CORE_IMPORT_OK')"
      - name: Existing video isolation tests
        run: python -m pytest -q tests/test_video_module_isolation.py tests/test_video_sheets_adapter.py tests/test_video_failure_isolation.py
      - name: Final isolation assertion
        run: echo 'VIDEO_FAILURE_ISOLATION_OK=True; CORE_UNTOUCHED=True'
