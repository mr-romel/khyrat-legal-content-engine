name: Blogger Organic Growth Loop

on:
  schedule:
    - cron: "15 5 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run_blogger_growth_loop.py"
      - "scripts/run_search_geo.py"
      - "src/search_geo.py"
      - "src/search_console_growth_ledger.py"
      - "src/blogger_seo_audit.py"
      - "src/blogger_search_console_prioritizer.py"
      - "tests/test_blogger_growth_loop.py"
      - "tests/test_search_geo.py"
      - ".github/workflows/blogger-growth-loop.yml"

permissions:
  contents: read

concurrency:
  group: blogger-organic-growth-loop
  cancel-in-progress: false

jobs:
  organic-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src:scripts
      SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BG' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit and Search Console dependencies
        run: |
          python -m pip install --disable-pip-version-check "requests>=2.32.0,<3.0.0" "google-api-python-client>=2.0.0" "google-auth>=2.0.0" pytest
      - name: Test growth measurement and prioritization
        run: pytest -q tests/test_blogger_growth_loop.py tests/test_blogger_search_console_prioritizer.py tests/test_blogger_seo_audit.py tests/test_search_geo.py
      - name: Inspect live Blogger pages, feed, canonical tags, sitemap and internal links
        continue-on-error: true
        run: python src/blogger_seo_audit.py
      - name: Read actual Google Search Console page and query performance
        run: python scripts/run_blogger_growth_loop.py
      - name: Build and backfill Search GEO records in the connected content sheet
        run: python scripts/run_search_geo.py
      - name: Preserve dated SEO, GEO and Search Console evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-organic-growth-report
          path: artifacts/seo-audit/
          if-no-files-found: warn
          retention-days: 90
