name: Blogger Exact Duplicate Cleanup

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/BLOGGER_DEDUPLICATE_RUN_NOW.md"

permissions:
  contents: read

concurrency:
  group: blogger-publication-v3
  cancel-in-progress: false

jobs:
  exact-duplicate-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Compile duplicate cleanup worker
        run: python -m compileall -q src scripts/deduplicate_blogger_articles.py
      - name: Delete exact duplicate live articles only
        run: PYTHONPATH=src python scripts/deduplicate_blogger_articles.py
