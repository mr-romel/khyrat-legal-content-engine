name: Deploy External Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/github-scheduler-dispatch/**"
      - ".github/workflows/deploy-external-scheduler.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Wrangler
        run: npm install --global wrangler@3.90.0

      - name: Verify Wrangler
        run: wrangler --version

      - name: Deploy Cloudflare Worker
        working-directory: workers/github-scheduler-dispatch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Configure GitHub dispatch token
        working-directory: workers/github-scheduler-dispatch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_DISPATCH_TOKEN }}
        run: |
          test -n "$GITHUB_DISPATCH_TOKEN"
          wrangler secret put GITHUB_DISPATCH_TOKEN --config wrangler.jsonc --name khyrat-github-scheduler-dispatch <<< "$GITHUB_DISPATCH_TOKEN"
