name: Blogger Exact Duplicate Cleanup
on:
  workflow_dispatch:
    inputs:
      apply_deletions:
        description: "Delete exact duplicate bodies and retain the oldest copy"
        type: boolean
        required: true
        default: true
  push:
    branches: [main]
    paths: [".github/BLOGGER_DEDUP_RUN_NOW.md"]
permissions:
  contents: write
concurrency:
  group: blogger-publication-v3
  cancel-in-progress: false
jobs:
  exact-duplicate-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
      BLOGGER_DEDUP_APPLY: ${{ github.event_name == 'push' && 'true' || inputs.apply_deletions }}
      BLOGGER_DEDUP_REPORT: data/blogger_dedup_report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Scan live articles and remove exact duplicates only
        run: |
          python -m compileall -q src scripts/deduplicate_blogger_articles.py
          PYTHONPATH=src python scripts/deduplicate_blogger_articles.py
      - name: Save duplicate report
        if: ${{ always() }}
        run: |
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blogger_dedup_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Blogger exact duplicate cleanup report"
          git push origin HEAD:main
