name: YouTube OAuth Safe Check (Read Only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/youtube_oauth_safe_check.py"
      - ".github/workflows/youtube-oauth-safe-check.yml"

permissions:
  contents: read

concurrency:
  group: youtube-oauth-safe-check
  cancel-in-progress: false

jobs:
  oauth-read-only:
    name: Validate upload and comment OAuth without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install requests
      - name: Refresh both tokens and verify scopes/channel access (read-only)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_COMMENT_CLIENT_ID: ${{ secrets.YOUTUBE_COMMENT_CLIENT_ID }}
          YOUTUBE_COMMENT_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMENT_CLIENT_SECRET }}
          YOUTUBE_COMMENT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMENT_REFRESH_TOKEN }}
        run: python scripts/youtube_oauth_safe_check.py
