name: Khyrat Legal Content Engine Scheduled

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# IMPORTANT: stages are isolated. A failure in Reel/Blogger/engagement must
# never block the other stages. Only the core publishing engine is the
# prerequisite for the downstream workers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  GEMINI_PRIMARY_ATTEMPTS: "2"
  GEMINI_FALLBACK_ATTEMPTS: "1"
  CLOUDFLARE_IMAGE_STEPS: "25"

jobs:
  publish:
    if: ${{ github.event_name != 'push' || github.event.head_commit.message == 'EMERGENCY_RUN_NOW' }}
    name: 1. Core Social Publisher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Run publishing engine
        id: publish
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_UI_STORAGE_STATE_B64: ${{ secrets.BLOGGER_UI_STORAGE_STATE_B64 }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_PRIMARY_ATTEMPTS: "2"
          GEMINI_FALLBACK_ATTEMPTS: "1"
          CLOUDFLARE_IMAGE_STEPS: "25"
          CLOUDFLARE_IMAGE_GUIDANCE: "6.0"
          KHYRAT_FORCE_DUE: ${{ github.event_name == 'push' && github.event.head_commit.message == 'EMERGENCY_RUN_NOW' && 'true' || 'false' }}
        run: timeout --signal=TERM --kill-after=30s 12m env PYTHONPATH=src python src/content_system_runtime.py

      - name: Lock Reel source context for downstream worker
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-source-context
          path: generated/reel_source.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Persist generated publishing assets
        if: ${{ success() }}
        continue-on-error: true
        run: |
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No generated assets to commit."
          else
            git commit -m "Store generated legal publishing assets"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            for attempt in 1 2 3; do
              if git push origin HEAD:${GITHUB_REF_NAME}; then
                echo "Generated assets pushed successfully."
                break
              fi
              echo "Generated asset push retry ${attempt}/3 after remote movement."
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
            done
          fi

  reel:
    name: 2. Reel Generator + Telegram Review
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Download locked Reel source context
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: reel-source-context
          path: generated
          merge-multiple: true

      - name: Cache Egyptian TTS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voicetut-egyptian-tts-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install uv
          pip install voicetut-tts "git+https://github.com/k2-fsa/OmniVoice.git"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate Reel independently
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AY' }}
          REEL_GOOGLE_SHEET_RANGE: 'Content!A:BC'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE || 'Orus' }}
          REEL_SKIP_GEMINI: "false"
          REEL_RECOVERY: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python src/reel_pipeline.py

      - name: Upload Reel review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-daily-reel
          path: generated/reels/
          if-no-files-found: ignore
          retention-days: 14

  blogger:
    name: 3. Blogger Publisher
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium

      - name: Publish Blogger independently
        env:
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_UI_STORAGE_STATE_B64: ${{ secrets.BLOGGER_UI_STORAGE_STATE_B64 }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AY' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
        run: PYTHONPATH=src python src/blogger_worker.py

  blogger_seo:
    name: 3b. Blogger SEO Search Description
    needs: blogger
    if: ${{ needs.blogger.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run Blogger Search Description worker
        env:
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          BLOGGER_UI_STORAGE_STATE_B64: ${{ secrets.BLOGGER_UI_STORAGE_STATE_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BC' }}
          BLOGGER_SEO_MAX_POSTS: "5"
        run: PYTHONPATH=src python src/blogger_seo_worker.py
  blogger_site_setup:
    name: 3c. Blogger Site Identity + Pages
    needs: blogger_seo
    if: ${{ needs.blogger_seo.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Create or update Blogger professional pages
        env:
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: PYTHONPATH=src python src/blogger_site_setup.py

  blogger_identity_setup:
    name: 3d. Blogger Brand Identity + Description
    needs: blogger_site_setup
    if: ${{ needs.blogger_site_setup.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Configure Blogger identity
        env:
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          BLOGGER_UI_STORAGE_STATE_B64: ${{ secrets.BLOGGER_UI_STORAGE_STATE_B64 }}
          BLOGGER_SITE_TITLE: "اسأل محمود - مستشار قانوني للشركات"
          BLOGGER_SITE_DESCRIPTION: "محتوى قانوني عملي للشركات وأصحاب الأعمال والإدارة والموارد البشرية حول العقود والعمل والشركات والمنازعات والإجراءات القانونية في مصر."
        run: PYTHONPATH=src python src/blogger_identity_worker.py

  linkedin_engagement:
    name: 4. LinkedIn Engagement
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Run LinkedIn engagement independently
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202607' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
          LINKEDIN_ENGAGEMENT_DELAY_MINUTES: "15"
          LINKEDIN_ENGAGEMENT_RETRY_MINUTES: "30"
          LINKEDIN_ENGAGEMENT_MAX_ATTEMPTS: "12"
          LINKEDIN_PERMISSION_RECHECK_HOURS: "24"
          KHYRAT_LINKEDIN_ENGAGEMENT_DRY_RUN: "false"
        run: PYTHONPATH=src python src/linkedin_engagement_worker.py

  facebook_engagement:
    name: 5. Facebook Engagement
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Run Facebook engagement independently
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION || '26.0' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
          FACEBOOK_ENGAGEMENT_DELAY_MINUTES: "15"
          FACEBOOK_ENGAGEMENT_RETRY_MINUTES: "30"
          FACEBOOK_ENGAGEMENT_MAX_ATTEMPTS: "12"
          KHYRAT_FACEBOOK_ENGAGEMENT_DRY_RUN: "false"
        run: PYTHONPATH=src python src/facebook_engagement_worker.py

  facebook_replies:
    name: 6. Facebook Comment Replies
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Run Facebook public comment replies independently
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION || '26.0' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
          FACEBOOK_COMMENT_REPLY_RECENT_POSTS: "3"
          FACEBOOK_COMMENT_REPLY_MAX_COMMENTS_PER_RUN: "5"
          FACEBOOK_COMMENT_REPLY_MAX_COMMENT_AGE_HOURS: "720"
        run: PYTHONPATH=src python src/facebook_private_reply_worker.py

  package:
    name: 7. Publishing Artifact
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Upload publishing package
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-publishing-package-${{ github.run_id }}
          path: generated/
          if-no-files-found: ignore
          retention-days: 14
