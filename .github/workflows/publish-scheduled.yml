name: Khyrat Legal Content Engine Scheduled

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GEMINI_PRIMARY_ATTEMPTS: "2"
  GEMINI_FALLBACK_ATTEMPTS: "1"
  CLOUDFLARE_IMAGE_STEPS: "25"

jobs:
  publish:
    name: Scheduled publisher
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run publishing engine
        id: publish
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}

          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_PRIMARY_ATTEMPTS: "2"
          GEMINI_FALLBACK_ATTEMPTS: "1"
          CLOUDFLARE_IMAGE_STEPS: "4"
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Publishing started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PYTHONPATH=src python src/content_system_runtime.py

      - name: Persist generated publishing assets
        if: ${{ steps.publish.outcome == 'success' }}
        run: |
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No generated assets to commit."
          else
            git commit -m "Store generated legal publishing assets"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload publishing package
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-publishing-package
          path: |
            generated/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run LinkedIn engagement immediately
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202607' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}

          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
          LINKEDIN_ENGAGEMENT_DELAY_MINUTES: "15"
          LINKEDIN_ENGAGEMENT_RETRY_MINUTES: "30"
          LINKEDIN_ENGAGEMENT_MAX_ATTEMPTS: "12"
          LINKEDIN_PERMISSION_RECHECK_HOURS: "24"
          KHYRAT_LINKEDIN_ENGAGEMENT_DRY_RUN: "false"
        continue-on-error: true
        run: PYTHONPATH=src python src/linkedin_engagement_worker.py

      - name: Run Facebook engagement immediately
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION || '26.0' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}

          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
          FACEBOOK_ENGAGEMENT_DELAY_MINUTES: "15"
          FACEBOOK_ENGAGEMENT_RETRY_MINUTES: "30"
          FACEBOOK_ENGAGEMENT_MAX_ATTEMPTS: "12"
          KHYRAT_FACEBOOK_ENGAGEMENT_DRY_RUN: "false"
        continue-on-error: true
        run: PYTHONPATH=src python src/facebook_engagement_worker.py

      - name: Run Facebook private replies immediately
        if: ${{ steps.publish.outcome == 'success' }}
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION || '26.0' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}

          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
          FACEBOOK_PRIVATE_REPLY_RECENT_POSTS: "3"
          FACEBOOK_PRIVATE_REPLY_MAX_COMMENTS_PER_RUN: "5"
          FACEBOOK_PRIVATE_REPLY_MAX_COMMENT_AGE_HOURS: "168"
        continue-on-error: true
        run: PYTHONPATH=src python src/facebook_private_reply_worker.py
