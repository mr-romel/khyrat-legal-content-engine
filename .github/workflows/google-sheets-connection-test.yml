name: Google Sheets Connection Test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/google-sheets-connection-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --upgrade pip gspread google-auth

      - name: Test Google Sheets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
        run: |
          python - <<'PY'
          import json, os, sys, gspread
          from google.oauth2.service_account import Credentials

          raw = os.environ.get("GOOGLE_CREDENTIALS", "")
          url = os.environ.get("GOOGLE_SHEET_URL", "")

          print("SECRET GOOGLE_CREDENTIALS:", "PRESENT" if raw else "MISSING")
          print("SECRET GOOGLE_SHEET_URL:", "PRESENT" if url else "MISSING")

          if not raw or not url:
              sys.exit(1)

          try:
              info = json.loads(raw)
          except Exception as exc:
              print("RESULT: GOOGLE_CREDENTIALS IS NOT VALID JSON")
              print("JSON ERROR TYPE:", type(exc).__name__)
              sys.exit(1)

          client_email = info.get("client_email", "")
          private_key = info.get("private_key", "")
          project_id = info.get("project_id", "")

          print("JSON client_email:", "PRESENT" if client_email else "MISSING")
          print("JSON private_key:", "PRESENT" if private_key else "MISSING")
          print("JSON project_id:", "PRESENT" if project_id else "MISSING")

          if not client_email or not private_key:
              print("RESULT: SERVICE ACCOUNT JSON IS INCOMPLETE")
              sys.exit(1)

          masked = client_email[:3] + "***@" + client_email.split("@",1)[1] if "@" in client_email else "***"
          print("SERVICE ACCOUNT:", masked)

          scopes = [
              "https://www.googleapis.com/auth/spreadsheets",
              "https://www.googleapis.com/auth/drive",
          ]
          creds = Credentials.from_service_account_info(info, scopes=scopes)
          print("AUTH OK")

          gc = gspread.authorize(creds)
          sh = gc.open_by_url(url)
          print("SHEET ACCESS OK:", sh.title)

          ws = sh.sheet1
          print("READ OK:", len(ws.row_values(1)), "columns")

          try:
              test_ws = sh.worksheet("_SYSTEM_TEST")
          except gspread.WorksheetNotFound:
              test_ws = sh.add_worksheet(title="_SYSTEM_TEST", rows=10, cols=3)

          test_ws.update("A1", [["GOOGLE_CONNECTION_TEST"]])
          test_ws.update("A2", [["WRITE_OK"]])
          print("WRITE OK")
          print("=== GOOGLE SHEETS TEST PASSED ===")
          PY
