name: Video Pilot (isolated)

on:
  push:
    branches: [feature/video-pilot]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  video-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Core import smoke test
        run: python -c "import main; print('CORE_IMPORT_OK')"
      - name: Video module tests
        run: python -m pytest -q tests/test_video_module_isolation.py tests/test_video_sheets_adapter.py
      - name: Build and render first pilot Reel
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          from urllib.request import urlopen
          from src.video_module.sheets_adapter import read_rows, posts_from_rows, is_published
          from src.video_module.reservation import ReservationStore
          from src.video_module.script import build_script
          from src.video_module.tts import EdgeTTSProvider, synthesize_with_fallback
          from src.video_module.render import render_vertical, validate_mp4

          posts = [p for p in posts_from_rows(read_rows()) if is_published(p) and p.image_url]
          if not posts:
              raise SystemExit('NO_ELIGIBLE_PUBLISHED_POST')
          post = posts[0]
          task = ReservationStore().reserve_first(posts, date.today())
          if task is None:
              raise SystemExit('NO_ELIGIBLE_VIDEO_TASK')
          script = build_script(post.topic, post.content)
          out = Path('video_artifacts'); out.mkdir(exist_ok=True)
          (out / 'script.txt').write_text(script, encoding='utf-8')
          audio = synthesize_with_fallback(script, out / 'voice.mp3', [EdgeTTSProvider()])
          image = out / 'source.jpg'
          with urlopen(post.image_url, timeout=20) as response:
              image.write_bytes(response.read())
          video = render_vertical(image, audio, out / 'reel.mp4')
          meta = validate_mp4(video)
          print(f'RESERVED_POST_ID={post.post_id}')
          print(f'RESERVED_ROW={post.row_number}')
          print(f'SCRIPT_WORDS={len(script.split())}')
          print(f'AUDIO_BYTES={audio.stat().st_size}')
          print(f'VIDEO_BYTES={video.stat().st_size}')
          print(f'MP4_VALIDATION={meta}')
          PY
      - name: Upload pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-pilot-artifacts
          path: video_artifacts/
          if-no-files-found: error
