name: Video Pilot (isolated)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/video_module/**'
      - '.github/workflows/video-pilot.yml'

permissions:
  contents: read

env:
  PYTHONPATH: src
  VIDEO_PILOT: "1"
  VIDEO_PILOT_MAX_CLOUDFLARE_IMAGES: "1"
  VIDEO_GEMINI_MAX_ATTEMPTS: "2"
  VIDEO_GEMINI_RETRY_DELAY_SECONDS: "8"

jobs:
  video-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: video_script_cache
          key: video-script-cache-v1
          restore-keys: |
            video-script-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Core import smoke test
        run: python -c "import main; print('CORE_IMPORT_OK')"
      - name: Video module tests
        run: python -m pytest -q tests/test_video_module_isolation.py tests/test_video_sheets_adapter.py tests/test_video_failure_isolation.py
      - name: Build full pilot Reel (no Meta publish)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIDEO_PILOT: "1"
          VIDEO_PILOT_MAX_CLOUDFLARE_IMAGES: "1"
          VIDEO_GEMINI_MAX_ATTEMPTS: "2"
          VIDEO_GEMINI_RETRY_DELAY_SECONDS: "8"
          VIDEO_PILOT_EGYPTIAN_REF_AUDIO: ""
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.video_module.production import build_once
          from src.video_module.render import validate_mp4

          result = build_once()
          print(f"BUILD_STATUS={result.get('status')}")
          if result.get('status') == 'GEMINI_QUOTA_EXHAUSTED':
              raise SystemExit('GEMINI_QUOTA_EXHAUSTED: no retry loop; wait for quota reset or use cached script')
          if result.get('status') != 'READY_FOR_META':
              raise SystemExit(f"VIDEO_BUILD_FAILED: {result}")

          work = Path('video_artifacts')
          scenes = sorted(work.glob('whiteboard/whiteboard_*.png'))
          print(f"WHITEBOARD_SCENE_COUNT={len(scenes)}")
          for i, scene in enumerate(scenes, 1):
              print(f"WHITEBOARD_SCENE_{i}={scene} BYTES={scene.stat().st_size}")
          if len(scenes) < 3:
              raise SystemExit('WHITEBOARD_SCENE_COUNT_BELOW_MINIMUM')

          logo = Path('generated/ask mahmoud logo.png')
          print(f"LOGO_SOURCE_EXISTS={logo.exists()}")
          if not logo.exists():
              raise SystemExit('LOGO_SOURCE_MISSING')

          video = Path(result['video'])
          meta = validate_mp4(video)
          print(f"VIDEO_BYTES={video.stat().st_size}")
          print(f"MP4_VALIDATION={meta}")
          print('META_PUBLISH=NOT_CALLED')
          PY
      - name: Upload pilot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-pilot-artifacts
          path: video_artifacts/
          if-no-files-found: error
