name: Khyrat Daily Blogger Trend Article

on:
  push:
    branches: [main]
    paths:
      - ".github/TREND_RUN_NOW.md"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khyrat-blogger-daily-trend
  cancel-in-progress: false

jobs:
  publish-daily-trend:
    name: Publish one verified Egypt legal trend article
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install -r requirements-reel.txt
      - name: Publish one daily Blogger trend article
        env:
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: PYTHONPATH=src python src/blogger_trend_worker.py
      - name: Persist generated trend article assets
        if: ${{ success() }}
        continue-on-error: true
        run: |
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/blogger-trends/
          if git diff --cached --quiet; then
            echo "No generated trend assets to persist."
          else
            git commit -m "Store daily Blogger trend article assets"
            git push origin HEAD:main
          fi
