name: Blogger Organic Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "src/blogger_seo_worker.py"
      - "src/search_console_intelligence.py"
      - "src/blogger_search_console_prioritizer.py"
      - "scripts/backfill_blogger_search_descriptions.py"
      - "scripts/run_blogger_growth_loop.py"
      - "tests/**"
      - ".github/workflows/blogger-organic-regression.yml"
  push:
    branches:
      - "fix/**"
    paths:
      - "src/blogger_seo_worker.py"
      - "src/search_console_intelligence.py"
      - "src/blogger_search_console_prioritizer.py"
      - "scripts/backfill_blogger_search_descriptions.py"
      - "scripts/run_blogger_growth_loop.py"
      - "tests/**"
      - ".github/workflows/blogger-organic-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-worker.txt -r requirements-browser.txt pytest
      - name: Run organic growth, GSC and Blogger safety tests
        run: |
          pytest -q \
            tests/test_blogger_growth_loop.py \
            tests/test_blogger_search_console_prioritizer.py \
            tests/test_blogger_seo_audit.py \
            tests/test_blogger_search_description_backfill.py \
            tests/test_blogger_seo_worker.py \
            tests/test_search_console_intelligence.py
