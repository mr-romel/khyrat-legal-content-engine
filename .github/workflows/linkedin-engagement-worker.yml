name: LinkedIn Engagement Worker

on:
  push:
    paths:
      - "ops/engagement-kick.txt"
  # Fallback only. GitHub scheduled workflows are best-effort.
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linkedin-engagement-worker
  cancel-in-progress: true

jobs:
  engagement:
    name: Process LinkedIn engagement queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202607' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
      LINKEDIN_ENGAGEMENT_DELAY_MINUTES: "15"
      LINKEDIN_ENGAGEMENT_RETRY_MINUTES: "30"
      LINKEDIN_ENGAGEMENT_MAX_ATTEMPTS: "12"
      LINKEDIN_PERMISSION_RECHECK_HOURS: "24"
      KHYRAT_LINKEDIN_ENGAGEMENT_DRY_RUN: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run engagement worker
        run: PYTHONPATH=src python src/linkedin_engagement_worker.py
