name: Khyrat Marketplace MVP

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/marketplace_mvp.py'
      - 'src/marketplace/**'
      - 'src/marketplace_daily.py'
      - 'tests/test_marketplace_mvp.py'
      - 'tests/test_marketplace_review.py'
      - 'tests/test_marketplace_isolation.py'
      - 'tests/test_marketplace_server.py'
      - 'tests/test_marketplace_pipeline.py'
      - 'tests/test_marketplace_opportunity_engine.py'
      - 'tests/test_marketplace_opportunity_queue.py'
      - 'tests/test_marketplace_revenue.py'
      - 'tests/test_marketplace_followup.py'
      - 'tests/test_marketplace_daily_ops.py'
      - 'tests/test_marketplace_daily_cli.py'
      - 'tests/test_marketplace_service_assets.py'
      - 'tests/test_marketplace_pro_dashboard.py'
      - 'tests/test_marketplace_command_center.py'
      - 'tests/test_marketplace_notifications.py'
      - 'tests/test_marketplace_discovery.py'
      - 'tests/test_marketplace_deployment_docs.py'
      - 'docs/MARKETPLACE_DEPLOYMENT.md'
      - 'docs/MARKETPLACE_ROLLOUT.md'
      - 'docs/MARKETPLACE_STATUS.md'
      - 'docs/IMPLEMENTATION_COMPLETE.md'
      - '.github/workflows/marketplace-mvp.yml'

concurrency:
  group: marketplace-mvp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  marketplace-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8.0.0,<9.0.0' 'Pillow>=10.0.0,<12.0.0' 'requests>=2.32.0,<3.0.0'
      - name: Run Marketplace tests
        run: python -m pytest -q tests/test_marketplace_mvp.py tests/test_marketplace_review.py tests/test_marketplace_isolation.py tests/test_marketplace_server.py tests/test_marketplace_pipeline.py tests/test_marketplace_opportunity_engine.py tests/test_marketplace_opportunity_queue.py tests/test_marketplace_revenue.py tests/test_marketplace_followup.py tests/test_marketplace_daily_ops.py tests/test_marketplace_daily_cli.py tests/test_marketplace_service_assets.py tests/test_marketplace_pro_dashboard.py tests/test_marketplace_command_center.py tests/test_marketplace_notifications.py tests/test_marketplace_discovery.py tests/test_marketplace_deployment_docs.py
      - name: Build review dashboard artifact
        run: python src/marketplace_mvp.py --seed-demo
      - name: Build daily execution plan
        run: python src/marketplace_daily.py --output marketplace_data/daily_plan.json
      - name: Upload Marketplace dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-marketplace-dashboard
          path: marketplace_data/
          if-no-files-found: error
