name: Khyrat Marketplace MVP

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/marketplace_mvp.py'
      - 'src/marketplace/**'
      - 'tests/test_marketplace_mvp.py'
      - 'tests/test_marketplace_review.py'
      - 'tests/test_marketplace_isolation.py'
      - 'tests/test_marketplace_server.py'
      - 'tests/test_marketplace_pipeline.py'
      - 'tests/test_marketplace_opportunity_engine.py'
      - '.github/workflows/marketplace-mvp.yml'

permissions:
  contents: read

jobs:
  marketplace-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install 'pytest>=8.0.0,<9.0.0'
      - name: Run Marketplace tests
        run: python -m pytest -q tests/test_marketplace_mvp.py tests/test_marketplace_review.py tests/test_marketplace_isolation.py tests/test_marketplace_server.py tests/test_marketplace_pipeline.py tests/test_marketplace_opportunity_engine.py
      - name: Build review dashboard artifact
        run: python src/marketplace_mvp.py --seed-demo
      - name: Upload Marketplace dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-marketplace-dashboard
          path: marketplace_data/
          if-no-files-found: error
