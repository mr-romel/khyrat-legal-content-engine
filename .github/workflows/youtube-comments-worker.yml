name: YouTube Shorts Comments Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/YOUTUBE_COMMENTS_RUN_NOW"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-shorts-comments-worker
  cancel-in-progress: false

jobs:
  youtube_comments:
    name: Publish one contextual comment on an eligible Short
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Run YouTube Shorts comments worker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
          YOUTUBE_COMMENT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMENT_REFRESH_TOKEN }}
          YOUTUBE_COMMENT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID || secrets.YOUTUBE_COMMENT_CLIENT_ID }}
          YOUTUBE_COMMENT_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMENT_CLIENT_SECRET }}
          YOUTUBE_COMMENTS_PER_RUN: "1"
        run: PYTHONPATH=src python src/youtube_comments_worker.py
