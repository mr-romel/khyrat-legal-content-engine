name: LinkedIn API Capability Test

on:
  push:
    paths:
      - ".github/workflows/linkedin-api-capability-test.yml"
  workflow_dispatch:

jobs:
  capability-test:
    runs-on: ubuntu-latest
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202607' }}

    steps:
      - name: Run safe LinkedIn capability probes
        shell: bash
        run: |
          set -uo pipefail

          if [[ -z "${LINKEDIN_ACCESS_TOKEN:-}" ]]; then
            echo "RESULT: LINKEDIN_ACCESS_TOKEN = MISSING"
            exit 1
          fi

          api() {
            local label="$1"
            local method="$2"
            local url="$3"
            local body="${4:-}"
            local response code payload

            if [[ -n "$body" ]]; then
              response=$(curl -sS -w $'\n%{http_code}' -X "$method" "$url" \
                -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
                -H "Linkedin-Version: $LINKEDIN_VERSION" \
                -H "X-Restli-Protocol-Version: 2.0.0" \
                -H "Content-Type: application/json" \
                --data "$body")
            else
              response=$(curl -sS -w $'\n%{http_code}' -X "$method" "$url" \
                -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
                -H "Linkedin-Version: $LINKEDIN_VERSION" \
                -H "X-Restli-Protocol-Version: 2.0.0")
            fi

            code="${response##*$'\n'}"
            payload="${response%$'\n'*}"

            echo
            echo "===== $label ====="
            echo "HTTP_STATUS: $code"
            echo "RESPONSE: $payload"

            LAST_CODE="$code"
            LAST_PAYLOAD="$payload"
          }

          echo "===== LinkedIn capability test ====="

          api "1. USERINFO" GET "https://api.linkedin.com/v2/userinfo"

          if [[ "$LAST_CODE" =~ ^2 ]]; then
            sub=$(printf '%s' "$LAST_PAYLOAD" | jq -r '.sub // empty')
            if [[ -z "$sub" ]]; then
              echo "RESULT: USERINFO = FAILED (no sub)"
              exit 1
            fi
            MEMBER_URN="urn:li:person:$sub"
            export MEMBER_URN
            echo "RESULT: USERINFO = $LAST_CODE (identity OK)"
            echo "MEMBER_URN: $MEMBER_URN"
          else
            echo "RESULT: USERINFO = $LAST_CODE (identity FAILED)"
            exit 1
          fi

          body=$(jq -nc --arg owner "$MEMBER_URN" '{initializeUploadRequest:{owner:$owner}}')
          api "2. IMAGE INITIALIZE" POST "https://api.linkedin.com/rest/images?action=initializeUpload" "$body"
          echo "RESULT: IMAGE_INITIALIZE = $LAST_CODE"

          post_body=$(jq -nc --arg author "$MEMBER_URN" '{author:$author}')
          api "3. POSTS AUTHORIZATION GATE" POST "https://api.linkedin.com/rest/posts" "$post_body"
          echo "RESULT: POSTS_GATE = $LAST_CODE"

          fake_post='urn:li:share:0000000000000000000'
          encoded_post=$(python -c 'import urllib.parse; print(urllib.parse.quote("urn:li:share:0000000000000000000", safe=""))')
          comment_body=$(jq -nc --arg actor "$MEMBER_URN" '{actor:$actor,message:{text:"capability-test"}}')
          api "4. COMMENTS AUTHORIZATION GATE" POST "https://api.linkedin.com/rest/socialActions/$encoded_post/comments" "$comment_body"
          echo "RESULT: COMMENTS_GATE = $LAST_CODE"

          encoded_actor=$(python -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["MEMBER_URN"], safe=""))')
          reaction_body=$(jq -nc --arg root "$fake_post" '{root:$root,reactionType:"LIKE"}')
          api "5. REACTIONS AUTHORIZATION GATE" POST "https://api.linkedin.com/rest/reactions?actor=$encoded_actor" "$reaction_body"
          echo "RESULT: REACTIONS_GATE = $LAST_CODE"

          echo
          echo "===== Interpretation ====="
          echo "2xx = endpoint accepted the request."
          echo "400/422 = request reached endpoint validation; not proof of permission."
          echo "401 = token authentication problem."
          echo "403 = permission/access problem."
          echo "404 = target/path validation problem is possible."
          echo
          echo "No public post, comment, or reaction is intentionally created."
