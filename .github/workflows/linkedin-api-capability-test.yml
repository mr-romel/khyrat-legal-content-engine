name: LinkedIn API Capability Test

on:
  push:
    paths:
      - ".github/workflows/linkedin-api-capability-test.yml"
  workflow_dispatch:

jobs:
  capability-test:
    runs-on: ubuntu-latest
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202607' }}
    steps:
      - name: Run safe LinkedIn capability probes
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${LINKEDIN_ACCESS_TOKEN:-}" ]]; then
            echo "ERROR: LINKEDIN_ACCESS_TOKEN is missing."
            exit 1
          fi

          api() {
            local label="$1"
            local method="$2"
            local url="$3"
            local body="${4:-}"

            echo "::group::$label"
            echo "METHOD: $method"
            echo "URL: $url"

            if [[ -n "$body" ]]; then
              response=$(curl -sS -w $'\n%{http_code}' -X "$method" "$url" \
                -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
                -H "Linkedin-Version: $LINKEDIN_VERSION" \
                -H "X-Restli-Protocol-Version: 2.0.0" \
                -H "Content-Type: application/json" \
                --data "$body")
            else
              response=$(curl -sS -w $'\n%{http_code}' -X "$method" "$url" \
                -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
                -H "Linkedin-Version: $LINKEDIN_VERSION" \
                -H "X-Restli-Protocol-Version: 2.0.0")
            fi

            code="${response##*$'\n'}"
            payload="${response%$'\n'*}"

            echo "HTTP_STATUS: $code"
            echo "RESPONSE: $payload"
            echo "::endgroup::"

            LAST_CODE="$code"
            LAST_PAYLOAD="$payload"
          }

          # 1) Identity: read-only, no side effect.
          api "1. userinfo" GET "https://api.linkedin.com/v2/userinfo"

          if [[ "$LAST_CODE" =~ ^2 ]]; then
            sub=$(printf '%s' "$LAST_PAYLOAD" | jq -r '.sub // empty')
            if [[ -z "$sub" ]]; then
              echo "ERROR: userinfo succeeded but did not return sub."
              exit 1
            fi
            MEMBER_URN="urn:li:person:$sub"
            echo "MEMBER_URN: $MEMBER_URN"
          else
            echo "userinfo failed; cannot continue safely."
            exit 1
          fi

          # 2) Image upload initialization: creates only an upload slot, not a published post.
          body=$(jq -nc --arg owner "$MEMBER_URN" '{initializeUploadRequest:{owner:$owner}}')
          api "2. images initializeUpload" POST "https://api.linkedin.com/rest/images?action=initializeUpload" "$body"

          # 3) Posts authorization gate: deliberately invalid payload.
          # A 400/422 means the request reached validation; a 401/403 points to auth/permission.
          api "3. posts authorization gate" POST "https://api.linkedin.com/rest/posts" '{"author":"'$MEMBER_URN'"}'

          # 4) Comments authorization gate: deliberately fake post URN; no comment is created.
          fake_post='urn:li:share:0000000000000000000'
          encoded_post=$(python - <<'PY'
import urllib.parse
print(urllib.parse.quote("urn:li:share:0000000000000000000", safe=""))
PY
)
          comment_body=$(jq -nc --arg actor "$MEMBER_URN" '{actor:$actor,message:{text:"capability-test"}}')
          api "4. comments authorization gate" POST "https://api.linkedin.com/rest/socialActions/$encoded_post/comments" "$comment_body"

          # 5) Reactions authorization gate: deliberately fake post URN; no reaction is created.
          encoded_post=$(python - <<'PY'
import urllib.parse
print(urllib.parse.quote("urn:li:share:0000000000000000000", safe=""))
PY
)
          reaction_body=$(jq -nc --arg root "$fake_post" '{root:$root,reactionType:"LIKE"}')
          api "5. reactions authorization gate" POST "https://api.linkedin.com/rest/reactions?actor=${encoded_actor}" "$reaction_body" || true

          echo
          echo "=== Interpretation ==="
          echo "userinfo: 2xx = identity scope works."
          echo "images initializeUpload: 2xx = image-upload permission/path accepted; 401/403 = auth/permission issue."
          echo "posts authorization gate: 400/422 = token reached endpoint validation; 401/403 = auth/permission issue."
          echo "comments authorization gate: 404/400 may mean fake target validation; 401/403 indicates auth/permission issue."
          echo "reactions authorization gate: current LinkedIn docs associate member feed reactions with w_member_social_feed."
          echo "No public post, comment, or reaction is intentionally created by this workflow."
