name: Khyrat Marketplace Dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/marketplace_mvp.py'
      - 'src/marketplace/**'
      - 'src/marketplace_daily.py'
      - 'src/marketplace/static_dashboard.py'
      - 'api/index.py'
      - 'requirements.txt'
      - 'marketplace_data/marketplace.json'
      - 'tests/test_marketplace_*.py'
      - 'docs/MARKETPLACE_*.md'
      - 'docs/IMPLEMENTATION_COMPLETE.md'
      - '.github/workflows/marketplace-dashboard.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  marketplace-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Gemini SDK
        run: python -c "from google import genai; print('Gemini SDK import: OK')"
      - name: Run Marketplace tests
        run: python -m pytest -q tests/test_marketplace_mvp.py tests/test_marketplace_review.py tests/test_marketplace_isolation.py tests/test_marketplace_server.py tests/test_marketplace_pipeline.py tests/test_marketplace_opportunity_engine.py tests/test_marketplace_opportunity_queue.py tests/test_marketplace_revenue.py tests/test_marketplace_followup.py tests/test_marketplace_daily_ops.py tests/test_marketplace_daily_cli.py tests/test_marketplace_service_assets.py tests/test_marketplace_pro_dashboard.py tests/test_marketplace_command_center.py tests/test_marketplace_notifications.py tests/test_marketplace_discovery.py tests/test_marketplace_live.py tests/test_marketplace_deployment_docs.py
      - name: Build Marketplace state
        run: python src/marketplace_mvp.py --seed-demo
      - name: Build daily execution plan
        run: python src/marketplace_daily.py --output marketplace_data/daily_plan.json
      - name: Build interactive static dashboard
        run: python src/marketplace/static_dashboard.py
      - name: Prepare GitHub Pages site
        run: |
          test -s marketplace_data/dashboard.html
          rm -rf marketplace_pages
          mkdir -p marketplace_pages
          cp marketplace_data/dashboard.html marketplace_pages/index.html
      - name: Upload Marketplace dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-marketplace-dashboard
          path: marketplace_data/
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketplace_pages/
      - name: Deploy Marketplace dashboard to GitHub Pages
        uses: actions/deploy-pages@v4
