name: Blogger Search Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
      timezone: "Africa/Cairo"
permissions:
  contents: read
jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Search Console + keyword intelligence
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SEARCH_CONSOLE_DAYS: "28"
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          BLOGGER_INTERNAL_LINK_WRITE: ${{ secrets.BLOGGER_INTERNAL_LINK_WRITE || 'false' }}
        run: python scripts/run_blogger_intelligence.py
