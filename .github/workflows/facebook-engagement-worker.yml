name: Facebook Engagement Worker

on:
  push:
    paths:
      - "ops/engagement-kick.txt"
      - "ops/facebook-engagement-kick.txt"
  # Fallback only. GitHub scheduled workflows are best-effort.
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facebook-engagement-worker
  cancel-in-progress: true

jobs:
  engagement:
    name: Process Facebook engagement queue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION || '26.0' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}

      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
      FACEBOOK_ENGAGEMENT_DELAY_MINUTES: "15"
      FACEBOOK_ENGAGEMENT_RETRY_MINUTES: "30"
      FACEBOOK_ENGAGEMENT_MAX_ATTEMPTS: "12"
      KHYRAT_FACEBOOK_ENGAGEMENT_DRY_RUN: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run engagement worker
        run: PYTHONPATH=src python src/facebook_engagement_worker.py
