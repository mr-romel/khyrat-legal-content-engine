name: Facebook Engagement Worker

on:
  push:
    paths:
      - "ops/engagement-kick.txt"
  # Cloudflare remains the primary scheduler. GitHub schedule is a redundancy
  # path so a missed external dispatch cannot silently stop engagement.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facebook-engagement-worker
  cancel-in-progress: true

jobs:
  engagement:
    name: Process Facebook engagement queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION || '26.0' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AF' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
      FACEBOOK_ENGAGEMENT_DELAY_MINUTES: "15"
      FACEBOOK_ENGAGEMENT_RETRY_MINUTES: "30"
      KHYRAT_FACEBOOK_ENGAGEMENT_DRY_RUN: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run engagement worker
        run: PYTHONPATH=src python src/facebook_engagement_worker.py
