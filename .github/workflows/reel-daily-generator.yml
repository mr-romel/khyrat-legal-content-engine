name: Daily Legal Reel Generator

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/REEL_CATCH_UP_NOW.md"

permissions:
  contents: write

concurrency:
  group: khyrat-reel-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
      GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
      GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE || 'Orus' }}
      KHYRAT_DRY_RUN: "false"
      REEL_SKIP_GEMINI: "false"
      REEL_RECOVERY: "true"
      REEL_MAX_DURATION_SECONDS: "40"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package.json
      - name: Install static FFmpeg and ffprobe binaries
        uses: FedericoCarboni/setup-ffmpeg@v3.1
      - name: Install Remotion renderer
        run: |
          cd remotion
          npm install --no-audit --no-fund
          test -x node_modules/.bin/remotion
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-reel.txt
          python -m pip install uv
      - name: Read-only audit of all Reel source rows
        run: |
          mkdir -p generated
          PYTHONPATH=src python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from config import load_reel_config
          from sheets import create_service, get_values, row_to_dict
          from reel_pipeline import _visual_topic_family

          cfg = load_reel_config()
          service = create_service(cfg['service_account_info'])
          tab = cfg['sheet_range'].split('!', 1)[0]
          values = get_values(service, cfg['sheet_id'], f'{tab}!A:BZ')
          if not values or not values[0]:
              raise SystemExit('REEL_BACKLOG_AUDIT_FAILED: Google Sheet header row is missing.')
          headers = [str(x or '').strip() for x in values[0]]
          rows = [(n, row_to_dict(raw, headers)) for n, raw in enumerate(values[1:], start=2)]
          protected = {'GENERATING', 'REGENERATING', 'REVIEW', 'APPROVED', 'PUBLISHED'}
          records = []
          counts = Counter()
          seen_ids = Counter(str(row.get('ID', '') or '').strip() for _, row in rows)
          for row_number, row in rows:
              source_id = str(row.get('ID', '') or '').strip()
              topic = str(row.get('الموضوع', '') or '').strip()
              post = str(row.get('المحتوى', '') or '').strip()
              fb = str(row.get('Facebook Status', '') or '').strip().upper()
              li = str(row.get('LinkedIn Status', '') or '').strip().upper()
              reel_status = str(row.get('Reel Status', '') or '').strip().upper()
              external_ids = [str(row.get(k, '') or '').strip() for k in ('Reel Facebook ID', 'Reel YouTube ID')]
              tf = _visual_topic_family(topic)
              pf = _visual_topic_family(post)
              aligned = bool(topic and post and (tf == 'general' or tf == pf))
              social = fb == 'PUBLISHED' or li == 'PUBLISHED'
              reasons = []
              if not source_id: reasons.append('missing_id')
              if not topic: reasons.append('missing_topic')
              if not post: reasons.append('missing_content')
              if not social: reasons.append('not_socially_published')
              if any(external_ids): reasons.append('external_reel_exists')
              if reel_status in protected: reasons.append('reel_status_locked')
              if topic and post and not aligned: reasons.append('topic_content_mismatch')
              eligible = bool(source_id and topic and post and social and not any(external_ids) and reel_status not in protected and aligned and seen_ids[source_id] == 1)
              if source_id and seen_ids[source_id] != 1: reasons.append('duplicate_source_id')
              counts['total_rows'] += 1
              counts['eligible_rows'] += int(eligible)
              counts['topic_content_mismatches'] += int('topic_content_mismatch' in reasons)
              counts['protected_rows'] += int('reel_status_locked' in reasons)
              counts['external_reel_rows'] += int('external_reel_exists' in reasons)
              if source_id or topic or post:
                  records.append({'row': row_number, 'source_id': source_id, 'topic': topic[:180], 'topic_family': tf, 'post_family': pf, 'facebook_status': fb, 'linkedin_status': li, 'reel_status': reel_status, 'eligible_for_new_reel': eligible, 'reasons': reasons})
          report = {'counts': dict(counts), 'records': records}
          Path('generated/reel_backlog_audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print('REEL_BACKLOG_AUDIT=' + json.dumps(report['counts'], ensure_ascii=False, sort_keys=True))
          print('REEL_BACKLOG_MISMATCH_ROWS=' + json.dumps([x for x in records if 'topic_content_mismatch' in x['reasons']], ensure_ascii=False))
          PY
      - name: Generate daily reel
        run: |
          # Remove any checkout-restored video so this run cannot pass on stale output.
          rm -rf generated/reels
          # This persisted one-off lock once pinned daily generation to an already-published row.
          rm -f generated/reel_source.json
          PYTHONPATH=src python src/reel_pipeline.py
          if ! find generated/reels -maxdepth 6 -type f -name '*.mp4' -size +100k -print -quit | grep -q .; then
            echo "::error::Daily Reel worker completed without producing a new MP4; treating this run as failed."
            exit 1
          fi
          # Source locks are run-local only; never commit a stale row pointer.
          rm -f generated/reel_source.json
      - name: Persist reusable approved scene images even if later Reel steps fail
        if: ${{ always() }}
        run: |
          if [ ! -d generated/reel_image_cache ]; then
            echo "No approved scene images were generated."
            exit 0
          fi
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated/reel_image_cache/
          if git diff --cached --quiet; then
            echo "No new approved scene images to cache."
          else
            git commit -m "Store reusable QA-approved Reel scene images"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Persist reel package
        if: ${{ success() }}
        run: |
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated/reels/ generated/reel_image_cache/
          if git diff --cached --quiet; then
            echo "No reel package changes."
          else
            git commit -m "Store daily legal reel package"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload read-only Reel backlog audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-backlog-audit
          path: generated/reel_backlog_audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload review package
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-daily-reel
          path: generated/reels/
          if-no-files-found: error
          retention-days: 14
