name: Khyrat Live Legal Source Recovery Check

on:
  push:
    branches: [main]
    paths:
      - "src/legal_research.py"
      - "scripts/legal_source_live_check.py"
      - ".github/workflows/legal-source-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khyrat-live-legal-source-check
  cancel-in-progress: false

jobs:
  live-source-check:
    name: Verify live Egyptian legal sources (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install legal research dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip certifi
          python -m pip install --disable-pip-version-check requests pypdf

      - name: Retrieve and verify both blocked topics live
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/legal_source_live_check.py
