name: Khyrat Video Material Layer

on:
  workflow_dispatch:
  schedule:
    # Check published posts every 30 minutes during the publishing window.
    # Video creation, upload, and publishing are manual; this workflow only
    # sends the approved Facebook post and Gemini Notebook prompt to Telegram.
    - cron: "0,30 10-23 * * *"
      timezone: "Africa/Cairo"
    - cron: "0 0 * * *"
      timezone: "Africa/Cairo"

concurrency:
  group: khyrat-video-layer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-video-task:
    name: Prepare Manual Gemini Notebook Material
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare manual Gemini Notebook material
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
        run: |
          PYTHONPATH=src python src/run_video_layer.py

      - name: Commit video material task packages
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/video_tasks/ || true
          if git diff --cached --quiet; then
            echo "No new video material task packages."
          else
            git commit -m "chore: prepare manual video material"
            git push
          fi
