name: Khyrat Legal Content Engine - Safe Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Safe AI and Comment Pipeline Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SAFE COMMENT DRY RUN
        env:
          KHYRAT_DRY_RUN: "true"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          PYTHONPATH=src python src/safe_dry_run.py

      - name: Test summary
        if: always()
        run: |
          echo "=============================================="
          echo "KHYRAT LEGAL CONTENT ENGINE - SAFE DRY RUN"
          echo "REAL CONTENT ROW: READ ONLY"
          echo "GOOGLE SHEETS: NO WRITE"
          echo "FACEBOOK: NO WRITE"
          echo "LINKEDIN: NO WRITE"
          echo "LIKES: NO WRITE"
          echo "COMMENTS: NO WRITE"
          echo "AI CONTENT/COMMENT GENERATION: ENABLED"
          echo "=============================================="
