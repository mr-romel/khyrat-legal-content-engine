name: Reel Now

on:
  push:
    paths:
      - ".reel-now-trigger"

permissions:
  contents: write

concurrency:
  group: khyrat-reel-now
  cancel-in-progress: false

jobs:
  reel:
    name: Generate current locked Reel and send Telegram review
    if: ${{ contains(fromJSON('["RUN_REEL_NOW","REEL_WHITEBOARD_REDESIGN","REEL_ROW23_RETRY","REEL_ROW179_RETRY"]'), github.event.head_commit.message) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package.json
      - name: Install Remotion renderer
        run: |
          cd remotion
          npm install --no-audit --no-fund
          test -x node_modules/.bin/remotion
      - name: Install Reel dependencies without apt stalls
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check --prefer-binary --retries 5 --timeout 60 -r requirements-reel.txt
          command -v ffmpeg
          command -v ffprobe
          fc-match "Noto Sans Arabic"
      - name: Restore the last committed Reel source lock for this one-off redesign
        if: ${{ github.event.head_commit.message == 'REEL_WHITEBOARD_REDESIGN' }}
        run: |
          mkdir -p generated
          cat > generated/reel_source.json <<'JSON'
          {
            "row_number": 147,
            "topic": "جريمة التحرش",
            "source_id": ""
          }
          JSON
          cat generated/reel_source.json
      - name: Lock failed row 23 for a controlled Reel retry
        if: ${{ github.event.head_commit.message == 'REEL_ROW23_RETRY' }}
        run: |
          mkdir -p generated
          cat > generated/reel_source.json <<'JSON'
          {
            "row_number": 23,
            "topic": "الادعاء المباشر — زاوية جديدة: Checklist عملية قبل بدء أي إجراء",
            "source_id": "20261010-1200-R010"
          }
          JSON
          cat generated/reel_source.json
      - name: Lock failed row 179 for a controlled Reel retry
        if: ${{ github.event.head_commit.message == 'REEL_ROW179_RETRY' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p generated
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from config import load_reel_config
          from sheets import create_service, get_values, row_to_dict

          cfg = load_reel_config()
          values = get_values(create_service(cfg["service_account_info"]), cfg["sheet_id"], cfg["sheet_range"])
          if len(values) < 179:
              raise SystemExit(f"ROW179_NOT_FOUND: sheet has only {len(values) - 1} data rows")
          row = row_to_dict(values[178], values[0])
          expected_topic = "حقيقة قرار إلزام الحضانات بكاميرات المراقبة والغرامات: التوضيح القانوني لأصحاب الأعمال وأولياء الأمور"
          if str(row.get("الموضوع", "")).strip() != expected_topic:
              raise SystemExit("ROW179_TOPIC_MISMATCH: refusing to lock the wrong content row")
          source_id = str(row.get("ID", "")).strip()
          if not source_id:
              raise SystemExit("ROW179_SOURCE_ID_MISSING: immutable row ID is required")
          source = {"row_number": 179, "topic": expected_topic, "source_id": source_id}
          Path("generated/reel_source.json").write_text(json.dumps(source, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Locked exact row 179 with immutable source ID; topic verified.")
          PY
          cat generated/reel_source.json
      - name: Validate Reel renderer syntax and required brand assets
        run: |
          python -m py_compile src/reel_pipeline.py
          test -s "لوجو اسال محمود 3دي.png"
      - name: Generate Reel and send Telegram review
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE || 'Orus' }}
          REEL_SKIP_GEMINI: "false"
          REEL_RECOVERY: "true"
          REEL_FORCE_REGENERATE: ${{ contains(fromJSON('["RUN_REEL_NOW","REEL_WHITEBOARD_REDESIGN","REEL_ROW23_RETRY","REEL_ROW179_RETRY"]'), github.event.head_commit.message) && 'true' || 'false' }}
          REEL_FORCE_TELEGRAM_REVIEW: ${{ contains(fromJSON('["RUN_REEL_NOW","REEL_WHITEBOARD_REDESIGN","REEL_ROW23_RETRY","REEL_ROW179_RETRY"]'), github.event.head_commit.message) && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Prevent a stale committed video from making a no-op run look successful.
          rm -rf generated/reels
          PYTHONPATH=src python src/reel_pipeline.py
          if ! find generated/reels -type f -name '*.mp4' -size +100k -print -quit | grep -q .; then
            echo "::error::Reel pipeline finished without creating a new MP4. Check the source-lock and Telegram delivery logs."
            exit 1
          fi
      - name: Upload Reel review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-daily-reel
          path: generated/reels/
          if-no-files-found: ignore
          retention-days: 14
