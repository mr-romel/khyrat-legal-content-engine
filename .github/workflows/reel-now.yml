name: Reel Now

on:
  push:
    paths:
      - ".reel-now-trigger"

permissions:
  contents: write

concurrency:
  group: khyrat-reel-now
  cancel-in-progress: false

jobs:
  reel:
    name: Generate current locked Reel and send Telegram review
    if: ${{ github.event.head_commit.message == 'RUN_REEL_NOW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate Reel and send Telegram review
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AY' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE || 'Orus' }}
          REEL_SKIP_GEMINI: "false"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python src/reel_pipeline.py
      - name: Persist Reel package
        if: ${{ always() }}
        run: |
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/reels/
          if git diff --cached --quiet; then
            echo "No new Reel package to commit."
          else
            git commit -m "Store current Reel review package"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
