name: Reel Now

on:
  push:
    paths:
      - ".reel-now-trigger"

permissions:
  contents: write

concurrency:
  group: khyrat-reel-now
  cancel-in-progress: false

jobs:
  reel:
    name: Generate current locked Reel and send Telegram review
    if: ${{ contains(fromJSON('["RUN_REEL_NOW","REEL_WHITEBOARD_REDESIGN"]'), github.event.head_commit.message) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Egyptian TTS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voicetut-egyptian-tts-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-reel.txt
          pip install uv
          pip install voicetut-tts "git+https://github.com/k2-fsa/OmniVoice.git"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Restore the last committed Reel source lock for this one-off redesign
        if: ${{ github.event.head_commit.message == 'REEL_WHITEBOARD_REDESIGN' }}
        run: |
          mkdir -p generated
          cat > generated/reel_source.json <<'JSON'
          {
            "row_number": 147,
            "topic": "جريمة التحرش",
            "source_id": ""
          }
          JSON
          cat generated/reel_source.json
      - name: Validate Reel renderer syntax and required brand assets
        run: |
          python -m py_compile src/reel_pipeline.py
          test -s "لوجو اسال محمود 3دي.png"
      - name: Generate Reel and send Telegram review
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AY' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE || 'Orus' }}
          REEL_SKIP_GEMINI: "false"
          REEL_RECOVERY: "true"
          REEL_FORCE_REGENERATE: ${{ github.event.head_commit.message == 'REEL_WHITEBOARD_REDESIGN' && 'true' || 'false' }}
          REEL_FORCE_TELEGRAM_REVIEW: ${{ github.event.head_commit.message == 'REEL_WHITEBOARD_REDESIGN' && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=src python src/reel_pipeline.py
      - name: Upload Reel review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-daily-reel
          path: generated/reels/
          if-no-files-found: ignore
          retention-days: 14
