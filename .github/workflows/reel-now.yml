name: Reel Now

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Exact immutable Google Sheet ID of the published social post
        required: true
        type: string
      force_replace:
        description: Allow replacing an existing REVIEW/APPROVED/PUBLISHED Reel for this exact ID
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: khyrat-reel-generation
  cancel-in-progress: false

jobs:
  reel:
    name: Generate current locked Reel and send Telegram review
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package.json
      - name: Install static FFmpeg and ffprobe binaries
        uses: FedericoCarboni/setup-ffmpeg@v3.1
      - name: Install Remotion renderer
        run: |
          cd remotion
          npm install --no-audit --no-fund
          test -x node_modules/.bin/remotion
      - name: Install Reel dependencies without apt stalls
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 5 --timeout 60 --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check --prefer-binary --retries 5 --timeout 60 -r requirements-reel.txt
          command -v ffmpeg
          command -v ffprobe
          fc-match "Noto Sans Arabic" || true
      - name: Lock exact source row by immutable ID
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
          REEL_GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REEL_SOURCE_ID: ${{ inputs.source_id }}
          REEL_FORCE_REPLACE: ${{ inputs.force_replace }}
        run: |
          mkdir -p generated
          PYTHONPATH=src python - <<'PY'
          import json, os
          from pathlib import Path
          from config import load_reel_config
          from sheets import create_service, get_values, row_to_dict
          cfg = load_reel_config()
          source_id = os.environ['REEL_SOURCE_ID'].strip()
          if not source_id:
              raise SystemExit('An immutable source ID is required.')
          service = create_service(cfg['service_account_info'])
          sheet_name = cfg['sheet_range'].split('!', 1)[0]
          values = get_values(service, cfg['sheet_id'], f'{sheet_name}!A:BZ')
          if not values or not values[0]:
              raise SystemExit('Google Sheet header row is missing.')
          headers = [str(x or '').strip() for x in values[0]]
          matches = [(n, row_to_dict(raw, headers)) for n, raw in enumerate(values[1:], start=2) if str(row_to_dict(raw, headers).get('ID', '') or '').strip() == source_id]
          if len(matches) != 1:
              raise SystemExit(f'Immutable source ID must match exactly one row; matches={len(matches)}.')
          row_number, row = matches[0]
          topic = str(row.get('الموضوع', '') or '').strip()
          content = str(row.get('المحتوى', '') or '').strip()
          social_ok = any(str(row.get(k, '') or '').strip().upper() == 'PUBLISHED' for k in ('Facebook Status', 'LinkedIn Status'))
          if not topic or not content or not social_ok:
              raise SystemExit('Source row must have topic, published post content, and at least one successful Facebook/LinkedIn publication.')
          reel_status = str(row.get('Reel Status', '') or '').strip().upper()
          external_video_ids = [str(row.get(k, '') or '').strip() for k in ('Reel Facebook ID', 'Reel YouTube ID')]
          if any(external_video_ids):
              raise SystemExit('This Reel already has an external Facebook/YouTube video ID; replacing its binary in place is unsupported and must not create duplicates.')
          if reel_status in {'REVIEW', 'APPROVED', 'PUBLISHED', 'REGENERATING'} and os.getenv('REEL_FORCE_REPLACE', '').lower() != 'true':
              raise SystemExit(f'Source ID already has Reel Status={reel_status}; set force_replace only when intentionally replacing that exact Reel.')
          source = {'row_number': row_number, 'source_id': source_id, 'topic': topic}
          Path('generated/reel_source.json').write_text(json.dumps(source, ensure_ascii=False, indent=2), encoding='utf-8')
          print('REEL_SOURCE_LOCKED=' + json.dumps({'source_id': source_id, 'current_row': row_number, 'topic': topic}, ensure_ascii=False))
          PY
          cat generated/reel_source.json
      - name: Validate Reel renderer syntax and required brand assets
        run: |
          python -m py_compile src/reel_pipeline.py
          test -s "لوجو اسال محمود 3دي.png"
      - name: Generate Reel and send Telegram review
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE || 'Orus' }}
          REEL_SKIP_GEMINI: "false"
          REEL_RECOVERY: "true"
          REEL_FORCE_REGENERATE: "true"
          REEL_FORCE_TELEGRAM_REVIEW: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Prevent a stale committed video from making a no-op run look successful.
          rm -rf generated/reels
          PYTHONPATH=src python src/reel_pipeline.py
          if ! find generated/reels -type f -name '*.mp4' -size +100k -print -quit | grep -q .; then
            echo "::error::Reel pipeline finished without creating a new MP4. Check the source-lock and Telegram delivery logs."
            exit 1
          fi
      - name: Persist reusable QA-approved scene image cache
        if: ${{ always() }}
        run: |
          if [ ! -d generated/reel_image_cache ]; then
            echo "No approved scene images were generated."
            exit 0
          fi
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generated/reel_image_cache/
          if git diff --cached --quiet; then
            echo "No new approved scene images to cache."
          else
            git commit -m "Store QA-approved Reel scene image cache"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload Reel review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-daily-reel
          path: generated/reels/
          if-no-files-found: ignore
          retention-days: 14
