name: Video Meta Pilot (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  meta-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Core import smoke test
        run: python -c "import main; print('CORE_IMPORT_OK')"
      - name: Verify video module isolation
        run: python -m pytest -q tests/test_video_module_isolation.py tests/test_video_sheets_adapter.py
      - name: Read-only Meta Graph API smoke test
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          page_id = os.environ.get('META_PAGE_ID', '').strip()
          token = os.environ.get('META_ACCESS_TOKEN', '').strip()
          if not page_id or not token:
              raise SystemExit('META_CONFIGURATION_MISSING')
          url = f'https://graph.facebook.com/v23.0/{urllib.parse.quote(page_id, safe="")}'
          params = urllib.parse.urlencode({'fields': 'id,name', 'access_token': token})
          request = urllib.request.Request(f'{url}?{params}', method='GET')
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.loads(response.read().decode('utf-8'))
          except Exception as exc:
              print(f'META_READ_ONLY_SMOKE_FAILED={type(exc).__name__}: {exc}')
              raise
          returned_id = str(data.get('id', ''))
          if returned_id != page_id:
              raise SystemExit('META_PAGE_ID_MISMATCH')
          print('META_READ_ONLY_SMOKE_OK=True')
          print(f'META_PAGE_ID_MATCH=True')
          print(f'META_PAGE_NAME_PRESENT={bool(data.get("name"))}')
          print('META_WRITE_OPERATION_PERFORMED=False')
          PY
      - name: Isolation assertion
        run: echo 'META_SMOKE_ISOLATED=True; NO_POST_CREATED=True'
