name: Video Meta Pilot (isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  meta-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Core import smoke test
        run: python -c "import main; print('CORE_IMPORT_OK')"
      - name: Verify video module isolation
        run: python -m pytest -q tests/test_video_module_isolation.py tests/test_video_sheets_adapter.py
      - name: Inspect Meta configuration without uploading
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          page = bool(os.getenv('META_PAGE_ID'))
          token = bool(os.getenv('META_ACCESS_TOKEN'))
          print(f'META_PAGE_ID_PRESENT={page}')
          print(f'META_ACCESS_TOKEN_PRESENT={token}')
          if not (page and token):
              raise SystemExit('META_CONFIGURATION_MISSING')
          print('META_CONFIGURATION_OK')
          PY
      - name: Download latest validated pilot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Meta upload remains intentionally disabled in this pilot.'
          echo 'The next step requires explicit Meta API endpoint/token contract verification.'
