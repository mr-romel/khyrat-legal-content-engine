name: Khyrat Legal Content Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: khyrat-legal-content-engine-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify trigger and Cairo time
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          cairo = datetime.now(ZoneInfo("Africa/Cairo"))
          utc = datetime.now(timezone.utc)
          print(f"GitHub event: {os.environ.get('GITHUB_EVENT_NAME', '')}")
          print(f"GitHub run ID: {os.environ.get('GITHUB_RUN_ID', '')}")
          print(f"GitHub SHA: {os.environ.get('GITHUB_SHA', '')}")
          print(f"Cairo time: {cairo.isoformat()}")
          print(f"UTC time: {utc.isoformat()}")
          PY

      - name: Cloudflare health check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          python - <<'PY'
          import os
          import urllib.request
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
          if not token:
              print("Cloudflare credentials are not configured; skipping health check.")
              raise SystemExit(0)
          request = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/user/tokens/verify",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"Cloudflare token verification failed: HTTP {response.status}")
          print("Cloudflare Workers AI health: OK")
          PY

      - name: Monthly recycler
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
        run: |
          python -c "import json, os; from src.monthly_recycler import recycle_month_if_needed; from src.sheets import create_service; from src.utils import now_cairo, sheet_name_from_range; service_account_info=json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']); sheet_id=os.environ['GOOGLE_SHEET_ID'].strip(); sheet_range=os.environ.get('GOOGLE_SHEET_RANGE','Content!A:U').strip() or 'Content!A:U'; recycle_month_if_needed(service=create_service(service_account_info), spreadsheet_id=sheet_id, sheet_name=sheet_name_from_range(sheet_range), current=now_cairo().date())"

      - name: Run main publishing engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=src python src/run_main.py

      - name: Commit generated image changes
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No generated image changes."
            exit 0
          fi
          git commit -m "chore: add generated legal image"
          git fetch origin main
          git rebase origin/main || {
            git rebase --abort || true
            git reset --hard origin/main
            git add generated/
            git commit -m "chore: add generated legal image" || true
          }
          git push origin HEAD:main
