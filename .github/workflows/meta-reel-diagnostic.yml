name: Meta Reel Diagnostic (no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements.txt
          python -m pip install edge-tts pytest
      - name: Core and isolation checks
        run: |
          python -c "import main; print('CORE_IMPORT_OK')"
          python -m pytest -q tests/test_video_module_isolation.py tests/test_video_sheets_adapter.py tests/test_video_failure_isolation.py
      - name: Verify Meta Page identity without publishing
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          page = os.environ['META_PAGE_ID'].strip()
          token = os.environ['META_ACCESS_TOKEN'].strip()
          if not page or not token: raise SystemExit('META_CONFIG_MISSING')
          def get(url, params):
              req=urllib.request.Request(url+'?'+urllib.parse.urlencode(params), method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw)
                  except json.JSONDecodeError: body={'raw':raw[:1000]}
                  print(f'META_IDENTITY_HTTP_{e.code}={body}')
                  raise
          identity=get(f'https://graph.facebook.com/v26.0/{urllib.parse.quote(page, safe="")}', {'fields':'id,name','access_token':token})
          print(f'META_PAGE_ID_CONFIRMED={identity.get("id","") == page}')
          print(f'META_PAGE_NAME={identity.get("name","")}')
          print('META_PUBLISH_PERFORMED=False')
          if identity.get('id') != page: raise SystemExit('META_PAGE_ID_MISMATCH')
          PY
      - name: Verify Reel endpoint without publishing
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          page=os.environ['META_PAGE_ID'].strip(); token=os.environ['META_ACCESS_TOKEN'].strip()
          url=f'https://graph.facebook.com/v26.0/{urllib.parse.quote(page, safe="")}/video_reels'
          req=urllib.request.Request(url, data=urllib.parse.urlencode({'access_token':token,'upload_phase':'start'}).encode(), method='POST')
          try:
              with urllib.request.urlopen(req, timeout=60) as r: data=json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try: data=json.loads(raw)
              except json.JSONDecodeError: data={'raw':raw[:1000]}
              print(f'META_REEL_START_HTTP_{e.code}={data}')
              raise
          print('META_REEL_START_OK=True')
          print('META_PUBLISH_PERFORMED=False')
          print(f'META_VIDEO_ID={data.get("video_id","")}')
      - name: Safety assertion
        run: echo 'NO_PUBLISH=True; DIAGNOSTIC_ONLY=True'
