name: Reel Production (manual only)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate the Reel without publishing to Meta'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  PYTHONPATH: src
  VIDEO_DAILY_LIMIT: "1"

jobs:
  reel-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and Arabic font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Install isolated video dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Core import smoke test
        run: python -c "import main; print('CORE_IMPORT_OK')"
      - name: Video isolation tests
        run: python -m pytest -q tests/test_video_module_isolation.py tests/test_video_sheets_adapter.py tests/test_video_failure_isolation.py
      - name: Build one Reel for manual inspection only
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          from src.video_module.production import build_once
          result = build_once()
          print(f"RESULT={result}")
          if result.get('status') not in {'READY_FOR_META', 'QUEUE_EMPTY'}:
              raise SystemExit('VIDEO_BUILD_FAILED')
          PY
      - name: Upload manual inspection artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reel-production-manual-inspection
          path: video_artifacts/
          if-no-files-found: ignore
