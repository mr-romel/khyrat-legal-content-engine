name: Regenerate Rejected Legal Reel

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reel-regenerate-rejected.yml"
      - "src/reel_pipeline.py"
      - "src/image_generator.py"
      - "src/image_qa.py"
      - "src/sheets.py"

permissions:
  contents: read

concurrency:
  group: khyrat-reel-generation
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
      GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL || 'gemini-3.8-flash-tts' }}
      GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE || 'Orus' }}
      REEL_SKIP_GEMINI: "false"
      REEL_RECOVERY: "true"
      REEL_FORCE_REGENERATE: "true"
      REEL_FORCE_TELEGRAM_REVIEW: "true"
      # One-time recovery pin to the immutable ID of the user's requested row.
      # Remove after this source reaches REVIEW or exhausts the bounded retry budget.
      REEL_RECOVERY_SOURCE_ID: "20261111-1000-R011"
      REEL_FORBIDDEN_VIDEO_SHA256: "5512ebc1239786037f4cd73cc4cd52e7108c60dc6174f06c41a8c7b967e109cd"
      REEL_MAX_DURATION_SECONDS: "40"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package.json
      - name: Install static FFmpeg and ffprobe binaries
        uses: FedericoCarboni/setup-ffmpeg@v3.1
      - name: Install Remotion renderer
        run: |
          cd remotion
          npm install --no-audit --no-fund
          test -x node_modules/.bin/remotion
      - name: Install Reel dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-reel.txt
      - name: Lock one rejected Reel for regeneration
        id: target
        run: |
          python - <<'PY'
          import json, os, re
          from sheets import create_service, get_values, row_to_dict, update_row
          raw = os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON") or os.getenv("GOOGLE_CREDENTIALS")
          if not raw or not os.getenv("GOOGLE_SHEET_ID"):
              raise SystemExit("Google Sheets credentials or sheet ID are missing.")
          service = create_service(json.loads(raw))
          sheet_id = os.environ["GOOGLE_SHEET_ID"]
          full_range = os.getenv("GOOGLE_SHEET_RANGE", "Content!A:BZ")
          sheet_name = full_range.split("!", 1)[0]
          # Always map against the live header row. HEADERS is only a fallback
          # for legacy tabs with no header row; relying on positional defaults
          # silently misses recovery flags when columns have moved.
          values = get_values(service, sheet_id, f"{sheet_name}!A:BZ")
          if not values:
              raise SystemExit("Google Sheet returned no rows; verify the configured tab/range.")
          headers = [str(value or "").strip() for value in values[0]]
          if not headers or not any(headers):
              raise SystemExit("Google Sheet header row is empty; refusing positional row selection.")
          target = None
          requested_rows = []
          for number, raw_row in enumerate(values[1:], start=2):
              row = row_to_dict(raw_row, headers)
              status = str(row.get("Reel Status", "")).strip().upper()
              last_error = str(row.get("Reel Last Error", "") or "").strip()
              review = str(row.get("Reel Review", "") or "").strip()
              retry_match = re.search(r"retry=(\d+)", review, flags=re.IGNORECASE)
              retry_count = int(retry_match.group(1)) if retry_match else 0
              source_id = str(row.get("ID", "") or "").strip()
              topic = str(row.get("الموضوع", "") or "").strip()
              requested = status == "REGENERATE_REQUESTED"
              retryable_image_failure = (
                  status == "FAILED"
                  and last_error.startswith("REEL_STAGE topic_specific_image_generation_failed")
                  and retry_count < 3
              )
              pinned_source_retry = (
                  bool(os.getenv("REEL_RECOVERY_SOURCE_ID", "").strip())
                  and source_id == os.getenv("REEL_RECOVERY_SOURCE_ID", "").strip()
                  and status == "FAILED"
                  and retry_count < 3
              )
              # Topic mismatch is a source-integrity failure, not an image-provider
              # outage. Never auto-retry it except when the user explicitly pins a
              # different immutable source ID for a bounded, one-time recovery.
              retryable_failure = retryable_image_failure or pinned_source_retry
              # Eligibility is based on immutable row identity plus a bounded retry
              # count; the pinned ID is explicit and never depends on row position.
              if not (requested or retryable_failure):
                  continue
              next_retry = retry_count + 1 if retryable_failure else retry_count
              requested_rows.append({
                  "row": number,
                  "source_id": source_id,
                  "status": status,
                  "retry": next_retry,
                  "pinned": pinned_source_retry,
                  "topic": topic,
              })
              existing_platform_ids = [
                  str(row.get("Reel Facebook ID", "") or "").strip(),
                  str(row.get("Reel YouTube ID", "") or "").strip(),
              ]
              if any(existing_platform_ids):
                  reason = "Recovery blocked: an external Facebook/YouTube Reel already exists; replacing its binary in place would create a duplicate."
                  update_row(service, sheet_id, sheet_name, number, {
                      "Reel Status": "FAILED",
                      "Reel Last Error": reason,
                  })
                  print(f"Skipping Reel recovery for source_id={source_id}: {reason}")
                  continue
              if not source_id or not topic or not str(row.get("المحتوى", "") or "").strip():
                  update_row(service, sheet_id, sheet_name, number, {
                      "Reel Status": "FAILED",
                      "Reel Last Error": "Cannot regenerate: missing row ID, topic, or source post content.",
                  })
                  continue
              if not any(str(row.get(k, "") or "").strip().upper() == "PUBLISHED" for k in ("Facebook Status", "LinkedIn Status")):
                  update_row(service, sheet_id, sheet_name, number, {
                      "Reel Status": "FAILED",
                      "Reel Last Error": "Cannot regenerate: source post has no successful Facebook/LinkedIn publication.",
                  })
                  continue
              target = (number, row, source_id, topic)
              break
          print("REEL_REGENERATION_REQUESTS=" + json.dumps(requested_rows, ensure_ascii=False))
          if not target:
              print("No REGENERATE_REQUESTED row passed source-data validation; inspect request list and row diagnostics.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("found=false\n")
              raise SystemExit(0)
          number, row, source_id, topic = target
          update_row(service, sheet_id, sheet_name, number, {
              "Reel Status": "REGENERATING",
              "Reel Approval": "",
              "Reel Review": f"REGENERATING | retry={next_retry} | " + ("explicit source-ID recovery" if pinned_source_retry else "Telegram rejection"),
              "Reel Last Error": "",
          })
          os.makedirs("generated", exist_ok=True)
          with open("generated/reel_source.json", "w", encoding="utf-8") as f:
              json.dump({"row_number": number, "source_id": source_id, "topic": topic}, f, ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"found=true\nrow_number={number}\n")
          print(f"REEL_REGENERATION_SELECTED row={number} source_id={source_id} topic={topic!r}")
          PY
      - name: Generate and send replacement for review
        if: steps.target.outputs.found == 'true'
        run: |
          rm -rf generated/reels
          PYTHONPATH=src python src/reel_pipeline.py
          if ! find generated/reels -maxdepth 6 -type f -name '*.mp4' -size +100k -print -quit | grep -q .; then
            echo "::error::Regeneration finished without a new MP4."
            exit 1
          fi
      - name: Upload replacement Reel review package
        if: success() && steps.target.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-daily-reel
          path: generated/reels/
          if-no-files-found: error
          retention-days: 14
