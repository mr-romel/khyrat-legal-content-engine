name: Blogger SEO Technical Snapshot

on:
  push:
    paths:
      - 'src/blogger_seo_audit.py'
      - 'src/blogger_search_console_prioritizer.py'
      - 'tests/test_blogger_seo_audit.py'
      - 'tests/test_blogger_search_console_prioritizer.py'
      - '.github/workflows/blogger-seo-audit.yml'
  schedule:
    - cron: "25 6 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-seo-technical-snapshot
  cancel-in-progress: true

jobs:
  public-seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit dependency
        run: python -m pip install "requests>=2.32.0,<3.0.0"

      - name: Run SEO unit tests
        run: |
          python -m pip install pytest
          PYTHONPATH=src pytest -q tests/test_blogger_seo_audit.py tests/test_blogger_search_console_prioritizer.py

      - name: Audit public Blogger endpoints and feed
        run: PYTHONPATH=src python src/blogger_seo_audit.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blogger-seo-audit
          path: artifacts/seo-audit/
          if-no-files-found: warn
          retention-days: 30
