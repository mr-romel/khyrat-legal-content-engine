name: Blogger Daily Search Demand Article

on:
  push:
    branches: [main]
    paths:
      - ".github/BLOGGER_DEMAND_RUN_NOW.md"
  schedule:
    # Run before the social publishing window; timezone is explicit to handle DST.
    - cron: "0 7 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # All Blogger writers share one lock; the UI session must never publish concurrently.
  group: blogger-publication-v3
  cancel-in-progress: false

jobs:
  publish-demand-article:
    name: Research Egyptian legal searches and publish one extra article
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install -r requirements-browser.txt
          python -m playwright install chromium

      - name: Research demand signals and publish the additional Blogger article
        env:
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_UI_STORAGE_STATE_B64: ${{ secrets.BLOGGER_UI_STORAGE_STATE_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-3.8-flash' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SEARCH_CONSOLE_DAYS: "28"
          BLOGGER_KEYWORD_MAP_PATH: data/blogger_keyword_map.json
          BLOGGER_DEMAND_FORCE: ${{ github.event_name == 'push' && github.event.head_commit.message == 'BLOGGER_DEMAND_RUN_NOW' && 'true' || 'false' }}
        run: PYTHONPATH=src python src/blogger_demand_worker.py

      - name: Persist keyword map and research history
        if: ${{ always() }}
        run: |
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/blogger_keyword_map.json ]; then
            echo "No keyword map was created; nothing to persist."
            exit 0
          fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Preserve this run's updated map while resetting the index to the
            # latest remote state; the shared Blogger lock serializes writers.
            git reset --mixed origin/main
            git add data/blogger_keyword_map.json
            if git diff --cached --quiet; then
              echo "Keyword map is already current on the remote."
              exit 0
            fi
            git commit -m "Update Blogger legal keyword map"
            if git push origin HEAD:main; then
              echo "Keyword map persisted."
              exit 0
            fi
            echo "Retrying keyword-map persistence (${attempt}/4)."
          done
          echo "Keyword map persistence failed after retries."
          exit 1
