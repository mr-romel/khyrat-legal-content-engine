name: Recovery Engine QA
on:
  push:
    branches: [feat/self-healing-queue-intelligence]
  pull_request:
permissions:
  contents: read
jobs:
  recovery-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile production modules
        run: python -m py_compile src/main.py src/sheets.py src/config.py src/recovery_engine.py
      - name: Run recovery policy tests
        run: PYTHONPATH=src python tests/test_recovery_engine.py
