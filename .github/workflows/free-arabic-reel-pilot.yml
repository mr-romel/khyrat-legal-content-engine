name: Free Arabic Reel Pilot (manual review only)

on:
  push:
    branches:
      - experiment/free-arabic-manim-reel
  workflow_dispatch:
    inputs:
      topic_override:
        description: "Optional topic for smoke testing; leave blank to read the next scheduled topic from Google Sheets"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: free-arabic-reel-pilot
  cancel-in-progress: false

jobs:
  build-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'RUN_FREE_ARABIC_REEL_PILOT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/free-arabic-manim-reel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Install CPU-only PyTorch and isolated pilot packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install git+https://github.com/k2-fsa/OmniVoice.git
          python -m pip install -r experiments/free-arabic-manim-reel/requirements.txt
      - name: Run pilot unit tests
        run: python -m pip install pytest && python -m pytest -q experiments/free-arabic-manim-reel/tests
      - name: Build one local-only Reel
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BC' }}
          REEL_PILOT_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BC' }}
          VOICETUT_SPEAKER: "Mohamed"
          REEL_PILOT_TOPIC_OVERRIDE: ${{ inputs.topic_override }}
        run: |
          if [ -n "$REEL_PILOT_TOPIC_OVERRIDE" ]; then
            python experiments/free-arabic-manim-reel/pilot.py --topic "$REEL_PILOT_TOPIC_OVERRIDE" --output-dir pilot-output
          else
            python experiments/free-arabic-manim-reel/pilot.py --output-dir pilot-output
          fi
      - name: Send generated Reel to Telegram for review (no publishing)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Missing TELEGRAM_BOT_TOKEN repository secret"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Missing TELEGRAM_CHAT_ID repository secret"; exit 1; }
          test -s pilot-output/free-arabic-legal-reel.mp4 || { echo "::error::Reel MP4 was not generated"; exit 1; }
          CAPTION="$(python - <<'PY'
          import json
          from pathlib import Path
          script = json.loads(Path("pilot-output/script.json").read_text(encoding="utf-8"))
          qa = json.loads(Path("pilot-output/qa.json").read_text(encoding="utf-8"))
          topic = str(script.get("topic", "بدون عنوان")).strip()
          caption = (
              "🎬 ريل قانوني — للمراجعة فقط\n"
              f"الموضوع: {topic}\n"
              f"المقاس: {qa.get('width')}×{qa.get('height')} | "
              f"الصوت: {qa.get('audio_codec')} | الفيديو: {qa.get('video_codec')}\n"
              "⚠️ لم يتم النشر على أي منصة. راجع النص والصوت والمعلومة القانونية قبل الموافقة."
          )
          print(caption[:1024])
          PY
          )"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 180 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "caption=${CAPTION}" \
            -F "supports_streaming=true" \
            -F "video=@pilot-output/free-arabic-legal-reel.mp4;type=video/mp4")"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True, "Telegram API did not confirm delivery"; print("Telegram review delivery confirmed; message_id=" + str(d["result"]["message_id"]))' "$RESPONSE"
      - name: Upload review artifact (no publishing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-arabic-manim-reel-pilot
          path: |
            pilot-output/free-arabic-legal-reel.mp4
            pilot-output/script.json
            pilot-output/qa.json
            pilot-output/narration.wav
          if-no-files-found: warn
          retention-days: 7
