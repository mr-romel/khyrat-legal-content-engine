name: Publish Approved Legal Reel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reel-publish-approved.yml"
      - "workers/telegram-control/src/index.js"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: khyrat-approved-reel-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .:src
      ROW_NUMBER: ""
      RUN_ID: ""
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BE' }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION || '26.0' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_COMMENT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMENT_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      - name: Find first approved Reel
        id: target
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BE' }}
        run: |
          python - <<'PY'
          import json, os
          from sheets import create_service, get_values, row_to_dict
          credentials_raw = os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON") or os.getenv("GOOGLE_CREDENTIALS")
          if not credentials_raw:
              raise SystemExit("Google service-account credentials are missing.")
          service_account_info = json.loads(credentials_raw)
          sheet_id = os.getenv("GOOGLE_SHEET_ID", "").strip()
          sheet_range = os.getenv("GOOGLE_SHEET_RANGE", "Content!A:BE").strip()
          # Reel control fields live after the core social columns. Always read through BC,
          # even when the shared GOOGLE_SHEET_RANGE secret is configured for a shorter workflow.
          if "!" in sheet_range:
              tab, _cols = sheet_range.split("!", 1)
          else:
              tab = "Content"
          sheet_range = f"{tab}!A:BE"
          if not sheet_id:
              raise SystemExit("GOOGLE_SHEET_ID is missing.")
          svc=create_service(service_account_info)
          values=get_values(svc,sheet_id,sheet_range)
          if not values:
              raise SystemExit("Google Sheet returned no rows; verify the configured tab/range.")
          headers=[str(x or "").strip() for x in values[0]]
          def mapped(raw):
              return {header: (raw[i] if i < len(raw) else "") for i, header in enumerate(headers) if header}
          candidates=[]
          # Prefer the newest approved work first; do not let an old partial publication starve new reels.
          for n, raw in reversed(list(enumerate(values[1:], start=2))):
              row=mapped(raw)
              status=str(row.get("Reel Status","")).strip().upper()
              approval=str(row.get("Reel Approval","")).strip().upper()
              run_id=str(row.get("Reel Run ID","")).strip()
              if approval=="APPROVED":
                  candidates.append((n,status,approval,run_id))
                  fb_id = str(row.get("Reel Facebook ID","")).strip()
                  yt_id = str(row.get("Reel YouTube ID","")).strip()
                  # Backfill Shorts for already-published Facebook Reels without reposting Facebook.
                  eligible_status = status in {"REVIEW","APPROVED","READY_TO_PUBLISH","PUBLISHED_PARTIAL","PUBLISH_FAILED"}
                  backfill_youtube = status == "PUBLISHED" and bool(fb_id) and not yt_id
                  if (eligible_status or backfill_youtube) and run_id:
                      with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
                          out.write(f"row_number={n}\nrun_id={run_id}\n")
                      print(f"Approved Reel found at row {n}; status={status}; run_id={run_id}")
                      raise SystemExit(0)
          # One-time recovery for the reel the owner explicitly confirmed was approved in Telegram.
          # Telegram's callback did not persist Reel Approval, so reconcile only this exact run ID.
          recovery_run_id = "39073320925"
          for n, raw in enumerate(values[1:], start=2):
              row = mapped(raw)
              status = str(row.get("Reel Status","")).strip().upper()
              approval = str(row.get("Reel Approval","")).strip().upper()
              run_id = str(row.get("Reel Run ID","")).strip()
              if run_id == recovery_run_id and status == "REVIEW" and not approval:
                  from sheets import update_row
                  update_row(svc, sheet_id, tab, n, {
                      "Reel Approval": "APPROVED",
                      "Reel Review": "اعتماد يدوي مؤكد من المستخدم؛ تمت استعادة تسجيل الاعتماد",
                  })
                  with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
                      out.write(f"row_number={n}\nrun_id={run_id}\n")
                  print(f"Recovered explicit Telegram approval for row {n}; run_id={run_id}")
                  raise SystemExit(0)
          print("Sheet tab/range used: " + sheet_range)
          print("Relevant headers: " + repr([(i+1, h) for i, h in enumerate(headers) if "reel" in h.lower() or "approval" in h.lower()]))
          print("Reel row diagnostics (last 20 rows): " + repr([(n, str(mapped(raw).get("Reel Status","")).strip(), str(mapped(raw).get("Reel Approval","")).strip(), str(mapped(raw).get("Reel Run ID","")).strip()) for n, raw in list(enumerate(values[1:], start=2))[-20:]]))
          print("No publishable approved Reel found. Approval rows: " + repr(candidates))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("row_number=\nrun_id=\n")
          PY

      - name: Skip when no approved Reel is waiting
        if: ${{ steps.target.outputs.row_number == '' }}
        run: |
          echo "No approved Reel is waiting; nothing to publish in this polling cycle."
          exit 0

      - name: Download reviewed reel package
        if: ${{ steps.target.outputs.row_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_NUMBER: ${{ steps.target.outputs.row_number }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          mkdir -p review-package
          gh run download "$RUN_ID" -n khyrat-daily-reel -D review-package

      - name: Verify manual approval
        if: ${{ steps.target.outputs.row_number != '' }}
        env:
          ROW_NUMBER: ${{ steps.target.outputs.row_number }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          python - <<'PY'
          import os
          from config import load_video_config
          from sheets import create_service, get_values, row_to_dict
          cfg=load_video_config()
          svc=create_service(cfg["service_account_info"])
          sheet=cfg["sheet_range"].split("!",1)[0]
          values=get_values(svc,cfg["sheet_id"],f"{sheet}!A:BE")
          headers=values[0] if values else []
          rows=[row_to_dict(r, headers) for r in values[1:]]
          n=int(os.environ["ROW_NUMBER"])
          row=rows[n-2]
          if str(row.get("Reel Status","")).strip().upper() not in {"REVIEW","APPROVED","READY_TO_PUBLISH","PUBLISHED_PARTIAL","PUBLISH_FAILED","PUBLISHED"}:
              raise SystemExit("Reel is not in an approved/publishable state.")
          if str(row.get("Reel Approval","")).strip().upper() != "APPROVED":
              raise SystemExit("Set Reel Approval to APPROVED in Google Sheets before publishing.")
          PY

      - name: Publish approved reel
        if: ${{ steps.target.outputs.row_number != '' }}
        env:
          ROW_NUMBER: ${{ steps.target.outputs.row_number }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from config import load_video_config
          from sheets import create_service, get_values, row_to_dict, update_row
          from reel_publishers import publish_facebook_video, publish_facebook_video_comment
          from youtube_publisher import publish_youtube_short, publish_youtube_short_comment

          cfg=load_video_config()
          svc=create_service(cfg['service_account_info'])
          sheet=cfg['sheet_range'].split('!',1)[0]
          values=get_values(svc,cfg['sheet_id'],f'{sheet}!A:BE')
          headers=values[0] if values else []
          row_number=int(os.environ['ROW_NUMBER'])
          row=row_to_dict(values[row_number-1], headers)
          run_id=str(os.environ.get('RUN_ID','')).strip()
          root=Path('review-package')/'generated'/'reels'/('row_'+str(row_number))
          if root.exists():
              video=root/'daily-reel.mp4'
              plan_path=root/'reel_plan.json'
          else:
              matches=list(Path('review-package').rglob('daily-reel.mp4'))
              if not matches: raise SystemExit('Approved reel MP4 was not found in downloaded artifact.')
              video=matches[0]
              plan_path=video.with_name('reel_plan.json')
          if not video.exists(): raise SystemExit(f'Approved reel file is missing: {video}')
          if video.stat().st_size < 100_000: raise SystemExit(f'Approved reel file is unexpectedly small ({video.stat().st_size} bytes): {video}')
          # Re-check the exact row immediately before any external publication to avoid stale approvals.
          latest_values=get_values(svc,cfg['sheet_id'],f'{sheet}!A:BE')
          latest_headers=latest_values[0] if latest_values else []
          latest_row=row_to_dict(latest_values[row_number-1], latest_headers)
          if str(latest_row.get('Reel Approval','')).strip().upper() != 'APPROVED':
              raise SystemExit('Approval was revoked or changed before publication; no platform was called.')
          if str(latest_row.get('Reel Run ID','')).strip() != run_id:
              raise SystemExit('The row Reel Run ID changed after selection; refusing to publish a mismatched artifact.')
          plan=json.loads(plan_path.read_text(encoding='utf-8')) if plan_path.exists() else {}
          fb_caption=str(plan.get('facebook_caption','') or row.get('المحتوى','')).strip()
          result={'facebook': {'video_id': str(row.get('Reel Facebook ID','')).strip()},
                  'youtube': {'video_id': str(row.get('Reel YouTube ID','')).strip(), 'url': str(row.get('Reel YouTube URL','')).strip()},
                  'run_id': run_id, 'row_number': row_number}
          errors=[]
          comment_warnings=[]
          fresh_facebook=False
          fresh_youtube=False

          # The prior failed run posted to Facebook before LinkedIn returned an expired-token error.
          # Its Facebook ID was not persisted. Never blindly repost that specific reel.
          facebook_outcome_uncertain = (run_id == '39073320925' and not result['facebook']['video_id'])
          if not result['facebook']['video_id'] and facebook_outcome_uncertain:
              errors.append('Facebook skipped: previous run may have published before failing; verify the Page before retrying to avoid a duplicate.')
          elif not result['facebook']['video_id']:
              try:
                  fb=publish_facebook_video(str(video), fb_caption)
                  result['facebook']=fb
                  fresh_facebook=True
                  update_row(svc,cfg['sheet_id'],sheet,row_number,{'Reel Facebook ID': fb['video_id'], 'Reel Status':'PUBLISHED_PARTIAL', 'Reel Last Error':'', 'Reel Review':'Facebook published; YouTube is being processed'})
              except Exception as exc:
                  errors.append('Facebook: '+str(exc))

          fb_ok=bool(result['facebook'].get('video_id'))
          # Publish to YouTube only after Facebook is confirmed. YouTube failure is recorded
          # independently so the successful Facebook publication is never repeated blindly.
          if fb_ok and not result['youtube'].get('video_id'):
              try:
                  title=str(plan.get('title', row.get('الموضوع', 'معلومة قانونية'))).strip()
                  # YouTube description must match the approved post copy for this exact Reel.
                  description=fb_caption
                  yt=publish_youtube_short(str(video), title, description)
                  result['youtube']=yt
                  fresh_youtube=True
                  update_row(svc,cfg['sheet_id'],sheet,row_number,{'Reel YouTube ID':yt['video_id'],'Reel YouTube URL':yt['url'],'Reel Status':'PUBLISHED_PARTIAL','Reel Last Error':'','Reel Review':'Facebook and YouTube published; confirm final status'})
              except Exception as exc:
                  errors.append('YouTube: '+str(exc))
          # Add one useful, first-party discussion prompt only for videos published in THIS run.
          # Comment failures must not turn a successful video upload into a false publish failure.
          title=str(plan.get('title', row.get('الموضوع', 'المعلومة القانونية'))).strip()
          comment_text=(f"إيه أكتر نقطة في موضوع «{title}» محتاج توضيحها؟ "
                        "اكتب سؤالك، واحفظ الفيديو للرجوع للمعلومة وقت الحاجة")[:900]
          result['comments']={'facebook': {'status':'NOT_NEEDED'}, 'youtube': {'status':'NOT_NEEDED'}}
          if fresh_facebook:
              try:
                  result['comments']['facebook']={'status':'PUBLISHED', **publish_facebook_video_comment(result['facebook']['video_id'], comment_text)}
              except Exception as exc:
                  result['comments']['facebook']={'status':'FAILED','error':str(exc)[:700]}
                  comment_warnings.append('Facebook comment: '+str(exc))
          if fresh_youtube:
              try:
                  result['comments']['youtube']={'status':'PUBLISHED', **publish_youtube_short_comment(result['youtube']['video_id'], comment_text)}
              except Exception as exc:
                  result['comments']['youtube']={'status':'FAILED','error':str(exc)[:700]}
                  comment_warnings.append('YouTube comment: '+str(exc))
          if comment_warnings:
              print('Video upload succeeded but one or more first-party comments failed: '+' | '.join(comment_warnings))
          Path('publish-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('publish-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          if errors:
              status='PUBLISHED_PARTIAL' if fb_ok else 'PUBLISH_FAILED'
              update_row(svc,cfg['sheet_id'],sheet,row_number,{'Reel Status':status,'Reel Last Error':' | '.join(errors)[:1500],
                  'Reel Review':'Facebook published; inspect missing publication metadata' if fb_ok else 'Facebook publish failed; inspect Reel Last Error'})
              raise SystemExit(' | '.join(errors))
          if not fb_ok: raise SystemExit('Facebook publication incomplete; not marking as published.')
          PY


      - name: Record publication in Google Sheets
        if: ${{ success() && steps.target.outputs.row_number != '' }}
        env:
          ROW_NUMBER: ${{ steps.target.outputs.row_number }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from config import load_video_config
          from sheets import create_service, update_row
          result=json.loads(open("publish-result.json",encoding="utf-8").read())
          cfg=load_video_config()
          svc=create_service(cfg["service_account_info"])
          sheet=cfg["sheet_range"].split("!",1)[0]
          update_row(svc,cfg["sheet_id"],sheet,int(os.environ["ROW_NUMBER"]),{
            "Reel Status":"PUBLISHED",
            "Reel Facebook ID":result["facebook"].get("video_id",""),
            "Reel YouTube ID":result.get("youtube",{}).get("video_id",""),
            "Reel YouTube URL":result.get("youtube",{}).get("url",""),
            "Reel Approval":"APPROVED",
            "Reel Review":"تم نشر الريلز على فيسبوك ويوتيوب بعد المراجعة اليدوية؛ لينكدإن معطّل",
            "Reel Last Error":"",
            "Reel Published At":os.environ.get("GITHUB_RUN_ID",""),
          })
          PY

      - name: Upload publication proof
        if: ${{ always() && steps.target.outputs.row_number != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-reel-publication-proof
          path: publish-result.json
          if-no-files-found: ignore
          retention-days: 14
