name: Khyrat Engine Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m compileall -q src
          echo "Python compile check: OK"

      - name: Import application modules
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import analytics
          import comment_engine
          import config
          import content_planner
          import facebook_publisher
          import gemini
          import gemini_chat
          import gemini_runtime
          import image_generator
          import linkedin_publisher
          import main
          import monthly_recycler
          import optimizer
          import performance
          import post_bank
          import safe_dry_run
          import sheets
          import telegram_bot
          import token_manager
          import topic_bank
          import utils
          print("Application module import check: OK")
          PY

      - name: Verify 200-topic legal content bank
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from topic_bank import CATEGORY_COUNTS, TOPIC_BANK

          assert len(TOPIC_BANK) == 200
          assert CATEGORY_COUNTS == {
              "القانون الجنائي": 40,
              "قانون الشركات والاستثمار": 40,
              "قانون الأسرة": 40,
              "قانون العمل الجديد": 40,
              "القانون الإداري": 40,
          }
          assert all(item["topic"].strip() for item in TOPIC_BANK)
          assert all(item["angle"].strip() for item in TOPIC_BANK)
          assert all(item["format"].strip() for item in TOPIC_BANK)
          assert all(item["objective"].strip() for item in TOPIC_BANK)
          print("200-topic bank validation: OK")
          print(f"Category distribution: {CATEGORY_COUNTS}")
          PY

      - name: Verify monthly diversification architecture
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from monthly_recycler import _topic_pool_for_month

          pool = _topic_pool_for_month("2026-08", set())
          assert len(pool) == 200
          assert len({item["topic"] for item in pool}) == 200
          first_month = [item["topic"] for item in _topic_pool_for_month("2026-08", set())[:20]]
          next_month = [item["topic"] for item in _topic_pool_for_month("2026-09", set())[:20]]
          assert first_month != next_month
          print("Monthly bank rotation/diversification check: OK")
          PY

      - name: Verify publishing schedule is 11:00 and 19:00 Cairo time
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import inspect
          import monthly_recycler

          assert monthly_recycler.POSTING_TIMES == ("11:00", "19:00")
          source = inspect.getsource(monthly_recycler)
          assert "14:00" not in source
          assert "20:00" not in source
          assert "11:00" in source
          assert "19:00" in source
          print("Publishing schedule check: 11:00 + 19:00 Africa/Cairo: OK")
          PY

      - name: Verify Gemini runtime architecture
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import inspect
          import gemini_chat
          import gemini_runtime
          import comment_engine

          chat_source = inspect.getsource(gemini_chat)
          runtime_source = inspect.getsource(gemini_runtime)
          comment_source = inspect.getsource(comment_engine)

          assert "client.chats.create" in chat_source
          assert "chat.send_message" in chat_source
          assert "import gemini_chat as _gemini" in runtime_source
          assert "client.chats.create" in comment_source
          assert "chat.send_message" in comment_source
          assert "GEMINI_FALLBACK_MODEL" in comment_source
          print("Gemini Chat API + retry/fallback architecture check: OK")
          PY

      - name: Safe dry-run configuration smoke test
        env:
          PYTHONPATH: src
          KHYRAT_DRY_RUN: "true"
          GOOGLE_SERVICE_ACCOUNT_JSON: '{"type":"service_account","project_id":"quality-check"}'
          GOOGLE_SHEET_ID: "quality-check-sheet"
          GOOGLE_SHEET_RANGE: "Content!A:U"
          GEMINI_API_KEY: "quality-check-key"
          GEMINI_MODEL: "gemini-3.6-flash"
        run: |
          python - <<'PY'
          from config import load_config

          config = load_config()
          assert config["sheet_id"] == "quality-check-sheet"
          assert config["cloudflare_account_id"] == ""
          assert config["cloudflare_api_token"] == ""
          assert config["facebook_page_access_token"] == ""
          assert config["linkedin_access_token"] == ""
          print("Safe dry-run configuration check: OK")
          PY
