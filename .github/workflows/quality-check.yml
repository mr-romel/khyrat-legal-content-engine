name: Khyrat Engine Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: .:src

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: |
          python -m compileall -q src
          echo "Python compile check: OK"
      - name: Import application modules
        run: |
          python - <<'PY'
          import analytics, comment_engine, config, content_planner, facebook_publisher, gemini, gemini_chat, gemini_runtime, image_generator, linkedin_publisher, main, monthly_recycler, optimizer, performance, post_bank, production_monitor, safe_dry_run, sheets, telegram_bot, token_manager, topic_bank, topic_bank_500, topic_bank_expanded, utils
          print("Application module import check: OK")
          PY
      - name: Verify 500 distinct legal subject bank
        run: |
          python - <<'PY'
          from recycler_rules import EXPANDED_TOPIC_BANK, base_topic_key
          from topic_bank_500 import TOPIC_BANK
          from topic_bank_expanded import EXTRA_TOPICS
          base_topics = {base_topic_key(item["topic"]) for item in TOPIC_BANK}
          extra_topics = {item.strip().casefold() for item in EXTRA_TOPICS}
          expanded_topics = {base_topic_key(item["topic"]) for item in EXPANDED_TOPIC_BANK}
          assert len(EXTRA_TOPICS) == 400
          assert len(extra_topics) == 400
          assert len(base_topics) == 100
          assert not (base_topics & extra_topics)
          assert len(EXPANDED_TOPIC_BANK) == 6900
          assert len(expanded_topics) == 500
          assert len(set(EXTRA_TOPICS)) == 400
          assert all(item["topic"].strip() and item["category"].strip() and item["angle"].strip() for item in EXPANDED_TOPIC_BANK)
          print("500-base-subject bank validation: OK")
          print(f"Canonical subjects: {len(base_topics)}")
          print(f"Expansion subjects: {len(extra_topics)}")
          print(f"Distinct legal subjects: {len(expanded_topics)}")
          print(f"Total selectable briefs: {len(EXPANDED_TOPIC_BANK)}")
          PY
      - name: Verify base-topic-first diversification
        run: |
          python - <<'PY'
          from monthly_recycler import _topic_pool_for_month
          from recycler_rules import base_topic_key, brief_key
          pool = _topic_pool_for_month("2026-08", set())
          assert len(pool) == 6900
          assert len({brief_key(item) for item in pool}) == 6900
          assert len({base_topic_key(item["topic"]) for item in pool}) == 500
          next_month = _topic_pool_for_month("2026-09", set())
          assert [(item["topic"], item["angle"]) for item in pool[:50]] != [(item["topic"], item["angle"]) for item in next_month[:50]]
          print("Base-topic-first monthly rotation/diversification check: OK")
          PY
      - name: Verify final architecture acceptance tests
        run: |
          python tests/final_architecture_acceptance.py
          python - <<'PY'
          from decision_engine import choose_due_row
          from production_monitor import summarize_publications
          history = [{"الموضوع": "أ — زاوية جديدة: الوقاية", "التصنيف": "جنائي", "زاوية المحتوى": "الوقاية"}]
          candidates = [(2, {"الموضوع": "أ — زاوية جديدة: حالة واقعية", "التصنيف": "جنائي", "زاوية المحتوى": "حالة واقعية"}), (3, {"الموضوع": "ب — زاوية جديدة: الوقاية", "التصنيف": "أسرة", "زاوية المحتوى": "الوقاية"})]
          assert choose_due_row(candidates, history)[1]["الموضوع"].startswith("ب")
          summary = summarize_publications([{"الحالة": "PUBLISHED", "الموضوع": "أ"}, {"الحالة": "PUBLISHED", "الموضوع": "ب"}])
          assert summary["healthy_diversity"] is True
          print("Final feedback + similarity + monitoring acceptance check: OK")
          PY
      - name: Verify publishing schedule is 11:00, 15:00 and 19:00 Cairo time
        run: |
          python - <<'PY'
          import monthly_recycler
          from recycler_rules import POSTING_TIMES
          assert POSTING_TIMES == ("11:00", "15:00", "19:00")
          assert monthly_recycler.POSTING_TIMES == POSTING_TIMES
          print("Publishing schedule check: 11:00 + 15:00 + 19:00 Cairo time: OK")
          PY
      - name: Verify Gemini runtime architecture
        run: |
          python - <<'PY'
          import inspect, gemini_chat, gemini_runtime, comment_engine
          assert "client.chats.create" in inspect.getsource(gemini_chat)
          assert "chat.send_message" in inspect.getsource(gemini_chat)
          assert "GEMINI_FALLBACK_MODEL" in inspect.getsource(comment_engine)
          print("Gemini Chat API + retry/fallback architecture check: OK")
          PY
      - name: Safe dry-run configuration smoke test
        env:
          KHYRAT_DRY_RUN: "true"
          GOOGLE_SERVICE_ACCOUNT_JSON: '{"type":"service_account","project_id":"quality-check"}'
          GOOGLE_SHEET_ID: "quality-check-sheet"
          GOOGLE_SHEET_RANGE: "Content!A:U"
          GEMINI_API_KEY: "quality-check-key"
          GEMINI_MODEL: "gemini-3.6-flash"
        run: |
          python - <<'PY'
          from config import load_config
          config = load_config()
          assert config["sheet_id"] == "quality-check-sheet"
          assert config["cloudflare_account_id"] == ""
          assert config["cloudflare_api_token"] == ""
          print("Safe dry-run configuration check: OK")
          PY
