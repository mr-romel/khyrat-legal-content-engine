name: Khyrat Legal Content Engine

on:
  workflow_dispatch:

  schedule:
    # Production publishing windows: shortly after 14:00 and 20:00 Cairo time.
    # We intentionally avoid minute 00 because GitHub documents that scheduled
    # workflows can be delayed or dropped during high-load periods at the start
    # of the hour. The engine still uses the exact Sheet date/time as its source
    # of truth and will never publish early.
    - cron: "7 14 * * *"
      timezone: "Africa/Cairo"
    - cron: "7 20 * * *"
      timezone: "Africa/Cairo"

concurrency:
  group: khyrat-legal-content-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Generate and Publish Social Content
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python --version
          pip --version
          python -c "import requests; print('requests:', requests.__version__)"
          python -c "import google.genai; print('google-genai: OK')"
          python -c "from PIL import Image; print('Pillow: OK')"

      - name: Prepare monthly recycled content queue
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
        run: |
          python -c "import json, os; from src.monthly_recycler import recycle_month_if_needed; from src.sheets import create_service; from src.utils import now_cairo, sheet_name_from_range; service_account_info=json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']); sheet_id=os.environ['GOOGLE_SHEET_ID'].strip(); sheet_range=os.environ.get('GOOGLE_SHEET_RANGE','Content!A:U').strip() or 'Content!A:U'; recycle_month_if_needed(service=create_service(service_account_info), spreadsheet_id=sheet_id, sheet_name=sheet_name_from_range(sheet_range), current=now_cairo().date())"

      - name: Run Khyrat Legal Content Engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: "464216073916915"
          FACEBOOK_GRAPH_VERSION: "26.0"
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
        run: |
          python src/main.py

      - name: Commit generated images
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ || true
          if git diff --cached --quiet; then
            echo "No generated image changes."
          else
            git commit -m "chore: add generated legal image"
            git push
          fi

      - name: Workflow summary
        if: always()
        run: |
          echo "=============================================="
          echo "KHYRAT LEGAL CONTENT ENGINE V2"
          echo "SMART SCHEDULER: 14:07 + 20:07 CAIRO"
          echo "SHEET SOURCE OF TRUTH: EXACT POST DATE/TIME"
          echo "POST BANK + AI COMMENTS + RETRY QUEUE"
          echo "TELEGRAM CONTROL + TOKEN HEALTH"
          echo "=============================================="
