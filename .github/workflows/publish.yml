name: Khyrat Legal Content Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10,20 * * *"
      timezone: "Africa/Cairo"

concurrency:
  group: khyrat-social-publishing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Full Social Publishing Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify environment
        run: |
          python --version
          pip --version
          python -c "import requests; print('requests', requests.__version__)"
          python -c "import PIL; print('Pillow', PIL.__version__)"
          python -c "import google.genai; print('google-genai installed')"

      - name: Run Khyrat Legal Content Engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: "464216073916915"
          FACEBOOK_GRAPH_VERSION: "26.0"

          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: "202607"

        run: python src/main.py

      - name: Commit generated images
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ || true
          if git diff --cached --quiet; then
            echo "No generated images to commit."
          else
            git commit -m "chore: add generated legal image"
            git push
          fi
