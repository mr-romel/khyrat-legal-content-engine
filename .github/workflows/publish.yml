name: Khyrat Legal Content Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "0,30 10-23 * * *"
      timezone: "Africa/Cairo"
    - cron: "0 0 * * *"
      timezone: "Africa/Cairo"

concurrency:
  group: khyrat-legal-content-engine
  cancel-in-progress: false

permissions:
  contents: write

env:
  PUBLISH_START_MINUTES: "600"
  PUBLISH_END_MINUTES: "0"

jobs:
  publish:
    name: Generate and Publish Social Content
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Cairo publishing window
        id: window
        run: |
          set -e
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Africa/Cairo"))
          minutes = now.hour * 60 + now.minute
          in_window = minutes == 0 or 600 <= minutes < 1440

          print(f"Cairo time: {now.isoformat()}")
          print(f"Publishing window active: {in_window}")

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"in_window={'true' if in_window else 'false'}\n")
          PY

      - name: Skip outside publishing window
        if: steps.window.outputs.in_window != 'true'
        run: |
          echo "Outside Cairo publishing window (10:00 AM - 12:00 AM)."
          echo "Stopping before dependencies, Google Sheets, Gemini, Cloudflare, or social APIs are used."
          exit 0

      - name: Set up Python
        if: steps.window.outputs.in_window == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.window.outputs.in_window == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python environment
        if: steps.window.outputs.in_window == 'true'
        run: |
          python --version
          pip --version
          python -c "import requests; print('requests:', requests.__version__)"
          python -c "import google.genai; print('google-genai: OK')"
          python -c "from PIL import Image; print('Pillow: OK')"

      - name: Cloudflare Workers AI health check
        if: steps.window.outputs.in_window == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              f"{account_id}/ai/models/search?search="
              + urllib.parse.quote("black-forest-labs/flux-1-schnell")
          )
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {token}"},
              method="GET",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if not payload.get("success"):
                  raise RuntimeError(str(payload.get("errors") or payload))
              print("Cloudflare Workers AI health: OK")
          except Exception as exc:
              message = (
                  "🚨 Cloudflare Workers AI Health Check FAILED\n"
                  f"السبب: {exc}\n"
                  "لن يبدأ النشر حتى يتم إصلاح CLOUDFLARE_API_TOKEN.\n"
                  "المطلوب: Workers AI Read/Write permission على الحساب."
              )
              print(message)
              if bot_token and chat_id:
                  try:
                      body = urllib.parse.urlencode({"chat_id": chat_id, "text": message}).encode()
                      telegram_request = urllib.request.Request(
                          f"https://api.telegram.org/bot{bot_token}/sendMessage",
                          data=body,
                          method="POST",
                      )
                      urllib.request.urlopen(telegram_request, timeout=15).read()
                      print("Telegram alert: sent")
                  except Exception as telegram_exc:
                      print(f"Telegram alert failed: {telegram_exc}")
              raise SystemExit(1)
          PY

      - name: Prepare monthly recycled content queue
        if: steps.window.outputs.in_window == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
        run: |
          python -c "import json, os; from src.monthly_recycler import recycle_month_if_needed; from src.sheets import create_service; from src.utils import now_cairo, sheet_name_from_range; service_account_info=json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']); sheet_id=os.environ['GOOGLE_SHEET_ID'].strip(); sheet_range=os.environ.get('GOOGLE_SHEET_RANGE','Content!A:U').strip() or 'Content!A:U'; recycle_month_if_needed(service=create_service(service_account_info), spreadsheet_id=sheet_id, sheet_name=sheet_name_from_range(sheet_range), current=now_cairo().date())"

      - name: Run Khyrat Legal Content Engine
        if: steps.window.outputs.in_window == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: "464216073916915"
          FACEBOOK_GRAPH_VERSION: "26.0"
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
        run: |
          PYTHONPATH=src python src/run_main.py

      - name: Commit generated images
        if: success() && steps.window.outputs.in_window == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ || true

          if git diff --cached --quiet; then
            echo "No generated image changes."
            exit 0
          fi

          git commit -m "chore: add generated legal image"

          for attempt in 1 2 3 4 5; do
            echo "Syncing with origin/main before push (attempt ${attempt}/5)..."
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Generated image commit pushed successfully."
                exit 0
              fi
            else
              echo "Rebase failed; aborting rebase safely."
              git rebase --abort || true
              exit 1
            fi

            sleep $((attempt * 3))
          done

          echo "Could not push generated image commit after 5 attempts."
          exit 1

      - name: Workflow summary
        if: always()
        run: |
          echo "=============================================="
          echo "KHYRAT LEGAL CONTENT ENGINE V2"
          echo "SCHEDULE: EVERY 30 MINUTES, 10:00 AM - MIDNIGHT (CAIRO)"
          echo "OUTSIDE WINDOW: EXIT BEFORE PROCESSING"
          echo "CLOUDFLARE HEALTH CHECK: BEFORE PUBLISHING"
          echo "SHEET SOURCE OF TRUTH: EXACT POST DATE/TIME"
          echo "GEMINI: RETRY + FALLBACK MODEL"
          echo "POST BANK + AI COMMENTS + RETRY QUEUE"
          echo "TELEGRAM CONTROL + TOKEN HEALTH"
          echo "GENERATED IMAGE PUSH: FETCH + REBASE + RETRY"
          echo "=============================================="
