name: Khyrat Legal Content Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10,20 * * *"
      timezone: "Africa/Cairo"

permissions:
  contents: write


jobs:

  publish:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Khyrat Legal Content Engine
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

          FACEBOOK_PAGE_ID: "464216073916915"
          FACEBOOK_GRAPH_VERSION: "26.0"

        run: |
          python src/main.py


      - name: Commit generated images
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/ || true

          if git diff --cached --quiet; then
            echo "No generated files to commit."
          else
            git commit -m "chore: add generated legal content image"
            git push
          fi
