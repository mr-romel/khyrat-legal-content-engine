name: Blogger Incoming Comments Moderator

on:
  push:
    branches: [main]
    paths:
      - ".github/BLOGGER_INCOMING_COMMENTS_RUN_NOW"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-incoming-comments-moderator
  cancel-in-progress: false

jobs:
  moderate:
    name: Read and classify incoming Blogger comments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOGGER_ENABLED: "true"
      BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      BLOGGER_GOOGLE_SHEET_RANGE: ${{ secrets.BLOGGER_GOOGLE_SHEET_RANGE || 'Content!A:BC' }}
      BLOGGER_INCOMING_MAX_COMMENTS: "100"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Compile moderation worker
        run: python -m py_compile src/comment_moderation.py src/blogger_incoming_comments_worker.py
      - name: Read and classify Blogger comments
        run: PYTHONPATH=src python src/blogger_incoming_comments_worker.py
