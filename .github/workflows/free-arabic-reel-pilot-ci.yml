name: Free Arabic Reel Pilot CI (isolated branch)

on:
  push:
    branches:
      - experiment/free-arabic-manim-reel
  pull_request:
    branches:
      - main
    paths:
      - "experiments/free-arabic-manim-reel/**"
      - ".github/workflows/free-arabic-reel-pilot-ci.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install fonts and lightweight test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install pytest Pillow arabic-reshaper python-bidi
      - name: Compile and run isolated unit tests
        run: |
          python -m compileall -q experiments/free-arabic-manim-reel
          python -m pytest -q experiments/free-arabic-manim-reel/tests
