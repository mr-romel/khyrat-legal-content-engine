name: Blogger OAuth Configuration Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate Blogger OAuth secret
    runs-on: ubuntu-latest
    env:
      BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
    steps:
      - name: Validate OAuth JSON shape
        run: |
          python - <<'PY'
          import json, os, sys
          raw = os.environ.get("BLOGGER_OAUTH_JSON", "").strip()
          if not raw:
              print("BLOGGER_OAUTH_JSON: MISSING")
              sys.exit(1)
          try:
              data = json.loads(raw)
          except Exception:
              print("BLOGGER_OAUTH_JSON: INVALID_JSON")
              sys.exit(1)
          if not isinstance(data, dict):
              print("BLOGGER_OAUTH_JSON: NOT_OBJECT")
              sys.exit(1)
          keys = set(data)
          required = {"client_id", "client_secret", "token_uri"}
          missing = sorted(required - keys)
          if missing:
              print("BLOGGER_OAUTH_JSON: CLIENT_CREDENTIALS_MISSING " + ",".join(missing))
              sys.exit(1)
          if not data.get("refresh_token"):
              print("BLOGGER_OAUTH_JSON: REFRESH_TOKEN_MISSING")
              print("The current secret is a client-download JSON, not an authorized-user token JSON.")
              sys.exit(2)
          print("BLOGGER_OAUTH_JSON: AUTHORIZED_USER_TOKEN_READY")
          print("refresh_token: PRESENT")
          print("scope: " + str(data.get("scopes") or data.get("scope") or "not embedded"))
          PY
