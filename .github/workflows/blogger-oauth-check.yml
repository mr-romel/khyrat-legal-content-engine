name: Blogger OAuth Read-only Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blogger-oauth-readonly-check
  cancel-in-progress: false

jobs:
  check:
    name: Verify Blogger OAuth without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
      GH_SECRET_ROTATION_TOKEN: ${{ secrets.GH_SECRET_ROTATION_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check OAuth and read accessible blogs
        run: PYTHONPATH=src python scripts/blogger_oauth_check.py
