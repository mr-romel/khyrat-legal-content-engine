name: Queue Audited Reel Recovery

on:
  workflow_dispatch:
    inputs:
      source_ids:
        description: Comma-separated immutable Sheet IDs to queue (maximum 20)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: khyrat-reel-recovery-queue
  cancel-in-progress: false

jobs:
  queue:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:BZ' }}
      REEL_RECOVERY_SOURCE_IDS: ${{ inputs.source_ids }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Sheet dependencies
        run: pip install -r requirements-worker.txt
      - name: Queue only the rows proven contaminated by the audit
        run: |
          python - <<'PY'
          import json, os
          from sheets import create_service, get_values, row_to_dict, update_row

          requested_ids = list(dict.fromkeys(x.strip() for x in os.getenv("REEL_RECOVERY_SOURCE_IDS", "").split(",") if x.strip()))
          if not requested_ids or len(requested_ids) > 20:
              raise SystemExit("Provide between 1 and 20 immutable source IDs; row numbers are not accepted.")
          raw = os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON") or os.getenv("GOOGLE_CREDENTIALS")
          if not raw or not os.getenv("GOOGLE_SHEET_ID"):
              raise SystemExit("Missing Google Sheets credentials or sheet ID.")
          sheet_id = os.environ["GOOGLE_SHEET_ID"]
          full_range = os.getenv("GOOGLE_SHEET_RANGE", "Content!A:BZ")
          tab = full_range.split("!", 1)[0]
          service = create_service(json.loads(raw))
          values = get_values(service, sheet_id, f"{tab}!A:BZ")
          if not values:
              raise SystemExit("Google Sheet is empty or inaccessible.")
          headers = [str(x or "").strip() for x in values[0]]
          queued, skipped = [], []
          for source_id in requested_ids:
              matches = [(number, row_to_dict(raw_row, headers)) for number, raw_row in enumerate(values[1:], start=2) if str(row_to_dict(raw_row, headers).get("ID", "") or "").strip() == source_id]
              if len(matches) != 1:
                  skipped.append({"source_id": source_id, "reason": f"immutable ID must match exactly one row; matches={len(matches)}"})
                  continue
              number, row = matches[0]
              topic = str(row.get("الموضوع", "") or "").strip()
              matched_source_id = str(row.get("ID", "") or "").strip()
              content = str(row.get("المحتوى", "") or "").strip()
              social_ok = any(str(row.get(k, "") or "").strip().upper() == "PUBLISHED" for k in ("Facebook Status", "LinkedIn Status"))
              if not (topic and matched_source_id == source_id and content and social_ok):
                  skipped.append({"source_id": source_id, "row": number, "topic": topic, "reason": "missing topic/content or no successful source social post"})
                  continue
              status = str(row.get("Reel Status", "") or "").strip().upper()
              existing_platform_ids = [
                  str(row.get("Reel Facebook ID", "") or "").strip(),
                  str(row.get("Reel YouTube ID", "") or "").strip(),
              ]
              if any(existing_platform_ids):
                  skipped.append({"source_id": source_id, "row": number, "topic": topic, "reason": "Reel already has an external Facebook/YouTube video; replacing its binary would require a separate platform migration and must not create duplicates"})
                  continue
              if status in {"GENERATING", "REGENERATING"}:
                  skipped.append({"row": number, "topic": topic, "reason": f"already {status}"})
                  continue
              update_row(service, sheet_id, tab, number, {
                  "Reel Status": "REGENERATE_REQUESTED",
                  "Reel Approval": "",
                  "Reel Review": "BULK_RECOVERY_QUEUED | audited duplicate/stale artifact",
                  "Reel Last Error": "",
                  "Reel File": "",
                  "Reel Run ID": "",
                  "Reel Video SHA256": "",
              })
              queued.append({"source_id": source_id, "current_row": number, "topic": topic, "previous_status": status})
          print("REEL_RECOVERY_QUEUE=" + json.dumps({"queued": queued, "skipped": skipped}, ensure_ascii=False))
          if not queued:
              raise SystemExit("No audited rows were safely queued.")
          PY
