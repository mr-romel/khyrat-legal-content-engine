name: Khyrat Legal Decision Makers

on:
  push:
    paths:
      - 'src/legal_decision_makers.py'
      - 'src/legal_decision_makers_dashboard.py'
      - 'tests/test_legal_decision_makers.py'
      - '.github/workflows/legal-decision-makers.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum decision makers to discover
        required: false
        default: '100'
      industries:
        description: Comma-separated target industries
        required: false
        default: 'manufacturing,technology,healthcare,construction,trading,logistics,real estate,food,services'
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: legal-decision-makers
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:src
      LEGAL_LEAD_LIMIT: ${{ github.event.inputs.limit || '100' }}
      LEGAL_LEAD_INDUSTRIES: ${{ github.event.inputs.industries || 'manufacturing,technology,healthcare,construction,trading,logistics,real estate,food,services' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover public LinkedIn decision makers
        run: |
          python - <<'PY'
          import os
          from legal_decision_makers import discover_leads, load_leads, merge_leads, save_leads
          industries = [x.strip() for x in os.environ['LEGAL_LEAD_INDUSTRIES'].split(',') if x.strip()]
          limit = int(os.environ['LEGAL_LEAD_LIMIT'])
          discovered = discover_leads(limit=limit, industries=industries)
          merged = merge_leads(load_leads(), discovered)
          save_leads(merged)
          print(f'discovered={len(discovered)} total={len(merged)}')
          for x in discovered[:20]:
              print(f"LEAD {x['score']:>3} {x['normalized_role']} | {x['name']} | {x['company']} | {x['linkedin_url']}")
          PY
      - name: Run regression tests
        run: python -m pytest -q tests/test_legal_decision_makers.py tests/test_marketplace_mvp.py tests/test_marketplace_review.py tests/test_marketplace_isolation.py tests/test_marketplace_server.py tests/test_marketplace_pipeline.py tests/test_marketplace_opportunity_engine.py tests/test_marketplace_opportunity_queue.py tests/test_marketplace_revenue.py tests/test_marketplace_followup.py tests/test_marketplace_daily_ops.py tests/test_marketplace_daily_cli.py tests/test_marketplace_service_assets.py tests/test_marketplace_pro_dashboard.py tests/test_marketplace_command_center.py tests/test_marketplace_notifications.py tests/test_marketplace_discovery.py tests/test_marketplace_live.py tests/test_marketplace_deployment_docs.py
      - name: Build lead dashboard
        run: |
          python src/legal_decision_makers_dashboard.py
          test -s marketplace_pages/leads.html
      - name: Commit lead database
        run: |
          git config user.name 'Khyrat Legal Lead Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f marketplace_data/legal_decision_makers.json marketplace_data/legal_decision_makers.csv
          if git diff --cached --quiet; then
            echo 'No lead changes.'
          else
            git commit -m 'chore: refresh legal decision maker leads'
            git pull --rebase origin main
            git push
          fi
      - name: Upload lead files
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-legal-decision-makers
          path: |
            marketplace_data/legal_decision_makers.json
            marketplace_data/legal_decision_makers.csv
            marketplace_pages/leads.html
          if-no-files-found: error
      - name: Prepare Pages artifact
        run: |
          mkdir -p pages
          cp marketplace_pages/leads.html pages/leads.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
