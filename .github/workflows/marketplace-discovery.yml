name: Khyrat Marketplace Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/marketplace-discovery.yml'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install 'requests>=2.32.0,<3.0.0'
      - name: Discover public Mostaql projects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from marketplace.discovery import discover_mostaql, merge_discoveries

          out = Path('marketplace_data/discovered_opportunities.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          existing = json.loads(out.read_text(encoding='utf-8')) if out.exists() else []
          discovered = discover_mostaql(limit=40)
          merged = merge_discoveries(existing, discovered)
          out.write_text(json.dumps(merged, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'discovered={len(discovered)} total={len(merged)}')
          PY
      - name: Commit changed discovery feed
        run: |
          git config user.name 'Khyrat Marketplace Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f marketplace_data/discovered_opportunities.json
          if git diff --cached --quiet; then
            echo 'No discovery changes.'
          else
            git commit -m 'chore: refresh Mostaql opportunity feed'
            git push
          fi
      - name: Upload discovery feed
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-marketplace-discovery
          path: marketplace_data/discovered_opportunities.json
          if-no-files-found: error
