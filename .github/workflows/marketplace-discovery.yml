name: Khyrat Marketplace Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install 'requests>=2.32.0,<3.0.0'
      - name: Discover live public Mostaql projects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from marketplace.discovery import discover_mostaql

          out = Path('marketplace_data/discovered_opportunities.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          discovered = discover_mostaql(limit=10)
          out.write_text(json.dumps(discovered, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'discovered_live={len(discovered)}')
          for item in discovered:
              print(f"LIVE {item['discovery_score']:>3} {item['title']} -> {item['source_url']}")
          PY
      - name: Commit changed discovery feed
        run: |
          git config user.name 'Khyrat Marketplace Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f marketplace_data/discovered_opportunities.json
          if git diff --cached --quiet; then
            echo 'No discovery changes.'
          else
            git commit -m 'chore: refresh live Mostaql opportunity feed'
            git push
          fi
      - name: Upload discovery feed
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-marketplace-discovery
          path: marketplace_data/discovered_opportunities.json
          if-no-files-found: error
