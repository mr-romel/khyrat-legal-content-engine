name: Khyrat Marketplace Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/marketplace/discovery.py'
      - 'src/marketplace/ai_media.py'
      - 'src/marketplace_mvp.py'
      - 'src/marketplace_daily.py'
      - 'src/marketplace/static_dashboard.py'
      - 'tests/test_marketplace_*.py'
      - '.github/workflows/marketplace-discovery.yml'
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: marketplace-discovery
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover and sync live public Mostaql projects
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          import marketplace.discovery as discovery
          from marketplace.discovery import discover_mostaql, merge_discoveries
          from marketplace_mvp import build_offer, load_state, save_state, score_opportunity

          feed_path = Path('marketplace_data/discovered_opportunities.json')
          feed_path.parent.mkdir(parents=True, exist_ok=True)
          previous = []
          if feed_path.exists():
              try:
                  previous = json.loads(feed_path.read_text(encoding='utf-8'))
              except (json.JSONDecodeError, OSError):
                  previous = []

          raw_business = discovery._fetch_business_page(20)
          print(f'business_page_chars={len(raw_business)}')
          print(f'business_project_markers={len(re.findall(r"/project(?:s)?/[^/?#\\s<>\"\']+", raw_business, re.I))}')
          candidates = discovery.parse_projects(raw_business, limit=20, official=True) if raw_business else []
          print(f'business_candidates={len(candidates)}')
          for candidate in candidates[:5]:
              print(f"CANDIDATE {candidate['title']} -> {candidate['source_url']}")
          if raw_business and not candidates:
              raise RuntimeError('Business filter fetched successfully but yielded zero real /project/<slug> candidates')

          discovered = discover_mostaql(limit=10)
          merged = merge_discoveries(previous, discovered)
          feed_changed = merged != previous
          if feed_changed:
              feed_path.write_text(json.dumps(merged, ensure_ascii=False, indent=2), encoding='utf-8')

          state = load_state()
          opportunities = state.setdefault('opportunities', [])
          by_url = {str(x.get('source_url')): x for x in opportunities if x.get('source_url')}
          live_urls = {str(x.get('source_url', '')).strip() for x in discovered if x.get('source_url')}
          before_prune = len(opportunities)
          opportunities[:] = [
              x for x in opportunities
              if not str(x.get('id', '')).startswith('opp-discovery-')
              or str(x.get('source_url', '')).strip() in live_urls
          ]
          pruned = before_prune - len(opportunities)
          by_url = {str(x.get('source_url')): x for x in opportunities if x.get('source_url')}
          added = 0
          refreshed = 0

          for item in discovered:
              url = str(item.get('source_url', '')).strip()
              if not url:
                  continue
              existing = by_url.get(url)
              if existing:
                  existing['title'] = item.get('title', existing.get('title', ''))
                  existing['description'] = item.get('description', existing.get('description', ''))
                  existing['source_url'] = url
                  existing['source_kind'] = 'mostaql_business_filter'
                  existing['source_filter'] = discovery.BUSINESS_FILTER_URL
                  existing['discovery_score'] = int(item.get('discovery_score', 0))
                  existing['live'] = True
                  if not existing.get('offer'):
                      score, rationale = score_opportunity(existing['title'], existing['description'])
                      existing['match_score'] = score
                      existing['rationale'] = rationale
                      existing['offer'] = build_offer(existing)
                      existing['status'] = 'OFFER_READY'
                  refreshed += 1
                  continue

              score, rationale = score_opportunity(item.get('title', ''), item.get('description', ''))
              stable_id = 'opp-discovery-' + hashlib.sha256(url.encode('utf-8')).hexdigest()[:16]
              opportunity = {
                  'id': stable_id,
                  'platform': 'mostaql',
                  'title': item.get('title', ''),
                  'description': item.get('description', '') or item.get('title', ''),
                  'source_url': url,
                  'source_kind': 'mostaql_business_filter',
                  'source_filter': discovery.BUSINESS_FILTER_URL,
                  'discovery_score': int(item.get('discovery_score', 0)),
                  'live': True,
                  'match_score': score,
                  'rationale': rationale,
                  'suggested_price_egp': 1500 if score >= 70 else 1000,
                  'suggested_days': 2 if score >= 70 else 4,
                  'status': 'OFFER_READY',
              }
              opportunity['offer'] = build_offer(opportunity)
              opportunities.insert(0, opportunity)
              by_url[url] = opportunity
              added += 1

          save_state(state)
          print(f'discovered_live={len(discovered)}')
          print(f'queue_added={added}')
          print(f'queue_refreshed={refreshed}')
          print(f'queue_pruned={pruned}')
          print(f'queue_total={len(opportunities)}')
          print(f'feed_changed={feed_changed}')
          for item in discovered:
              print(f"LIVE {item['discovery_score']:>3} {item['title']} -> {item['source_url']}")
          PY
      - name: Run Marketplace regression tests
        run: python -m pytest -q tests/test_marketplace_mvp.py tests/test_marketplace_review.py tests/test_marketplace_isolation.py tests/test_marketplace_server.py tests/test_marketplace_pipeline.py tests/test_marketplace_opportunity_engine.py tests/test_marketplace_opportunity_queue.py tests/test_marketplace_revenue.py tests/test_marketplace_followup.py tests/test_marketplace_daily_ops.py tests/test_marketplace_daily_cli.py tests/test_marketplace_service_assets.py tests/test_marketplace_pro_dashboard.py tests/test_marketplace_command_center.py tests/test_marketplace_notifications.py tests/test_marketplace_discovery.py tests/test_marketplace_live.py tests/test_marketplace_deployment_docs.py
      - name: Build Marketplace daily plan and dashboard
        run: |
          python src/marketplace_daily.py --output marketplace_data/daily_plan.json
          python src/marketplace/static_dashboard.py
          test -s marketplace_data/dashboard.html
          rm -rf marketplace_pages
          mkdir -p marketplace_pages
          cp marketplace_data/dashboard.html marketplace_pages/index.html
      - name: Commit changed discovery feed and marketplace queue
        run: |
          git config user.name 'Khyrat Marketplace Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f marketplace_data/discovered_opportunities.json marketplace_data/marketplace.json marketplace_data/daily_plan.json marketplace_data/dashboard.html
          if git diff --cached --quiet; then
            echo 'No discovery changes.'
          else
            git commit -m 'chore: refresh and sync live Mostaql opportunity feed'
            git pull --rebase origin main
            git push
          fi
      - name: Upload discovery and dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: khyrat-marketplace-discovery
          path: marketplace_data/
          if-no-files-found: error
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketplace_pages/
      - name: Deploy Marketplace dashboard to GitHub Pages
        uses: actions/deploy-pages@v4
