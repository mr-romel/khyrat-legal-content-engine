name: Blogger SEO GEO Publisher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/BLOGGER_PUBLISHER_RUN_NOW.md"

permissions:
  contents: write

concurrency:
  group: blogger-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'push' || github.event.head_commit.message == 'BLOGGER_PUBLISHER_RUN_NOW' }}
    name: Publish next Blogger article
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOGGER_DRY_RUN: "false"
      BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
      BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
      BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
      BLOGGER_UI_STORAGE_STATE_B64: ${{ secrets.BLOGGER_UI_STORAGE_STATE_B64 }}
      BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
      GEMINI_FALLBACK_MODEL: ${{ secrets.GEMINI_FALLBACK_MODEL || 'gemini-2.5-flash' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_RANGE: ${{ secrets.GOOGLE_SHEET_RANGE || 'Content!A:AM' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Publish next Blogger article
        run: PYTHONPATH=src python src/blogger_worker.py

      - name: Persist Blogger artifacts
        if: ${{ success() }}
        run: |
          git config user.name "Khyrat Legal Content Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/blogger/
          if git diff --cached --quiet; then
            echo "No Blogger artifacts to commit."
          else
            git commit -m "Store generated Blogger article"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
