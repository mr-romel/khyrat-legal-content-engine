name: Facebook Tag Diagnostic

on:
  workflow_dispatch:

jobs:
  facebook-tag-diagnostic:
    runs-on: ubuntu-latest

    env:
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      EXPECTED_PAGE_ID: "464216073916915"
      EXPECTED_PAGE_NAME: "اسأل محمود - مستشار قانوني للشركات"
      FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION || '26.0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate Facebook configuration
        shell: bash
        run: |
          set -e

          if [ -z "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then
            echo "ERROR: FACEBOOK_PAGE_ACCESS_TOKEN is missing."
            exit 1
          fi

          echo "Facebook configuration detected."
          echo "Expected Page ID: $EXPECTED_PAGE_ID"
          echo "Expected Page name: $EXPECTED_PAGE_NAME"
          echo "Graph API version: $FACEBOOK_GRAPH_VERSION"

      - name: Inspect Page token identity
        shell: bash
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"]
          version = os.environ["FACEBOOK_GRAPH_VERSION"]

          expected_page_id = os.environ["EXPECTED_PAGE_ID"]
          expected_page_name = os.environ["EXPECTED_PAGE_NAME"]

          url = f"https://graph.facebook.com/{version}/me"

          params = {
              "fields": "id,name",
              "access_token": token,
          }

          response = requests.get(
              url,
              params=params,
              timeout=30,
          )

          print("HTTP status:", response.status_code)

          try:
              data = response.json()
          except Exception:
              print("Facebook returned a non-JSON response.")
              print(response.text[:1000])
              raise SystemExit(1)

          print("Facebook response:")
          print(data)

          if not response.ok:
              print()
              print("Facebook Page token validation: FAILED")
              raise SystemExit(1)

          page_id = data.get("id")
          page_name = data.get("name")

          print()
          print("Facebook Page token validation: OK")
          print("Resolved Page ID:", page_id)
          print("Resolved Page name:", page_name)

          if page_id != expected_page_id:
              print()
              print("ERROR: The Page Access Token does not belong to")
              print("the expected page.")
              print("Expected:", expected_page_id)
              print("Received:", page_id)
              raise SystemExit(1)

          print()
          print("SUCCESS: Page Access Token belongs to the expected page.")
          PY

      - name: Inspect Page token permissions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"]
          version = os.environ["FACEBOOK_GRAPH_VERSION"]

          url = f"https://graph.facebook.com/{version}/me/permissions"

          params = {
              "access_token": token,
          }

          response = requests.get(
              url,
              params=params,
              timeout=30,
          )

          print("HTTP status:", response.status_code)

          try:
              data = response.json()
          except Exception:
              print("Facebook returned a non-JSON response.")
              print(response.text[:1000])
              raise SystemExit(1)

          print("Permissions response:")
          print(data)

          if not response.ok:
              print()
              print("Could not inspect Page Access Token permissions.")
              raise SystemExit(1)

          print()
          print("Page Access Token permissions inspection: OK")
          PY

      - name: Test personal profile lookup
        shell: bash
        env:
          PERSONAL_PROFILE_URL: "https://www.facebook.com/MODY.ROMEL.UA07"
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["FACEBOOK_PAGE_ACCESS_TOKEN"]
          version = os.environ["FACEBOOK_GRAPH_VERSION"]
          profile_url = os.environ["PERSONAL_PROFILE_URL"]

          print("==============================================")
          print("PERSONAL PROFILE DIAGNOSTIC")
          print("==============================================")
          print("Profile under test:")
          print(profile_url)
          print()
          print("This step:")
          print("- Does NOT publish a post.")
          print("- Does NOT create a tag.")
          print("- Does NOT create a comment.")
          print("- Does NOT create a like.")
          print("- Does NOT modify the production workflow.")
          print()
          print("It only tests whether Meta allows the current")
          print("Page Access Token to resolve this personal profile.")

          username = "MODY.ROMEL.UA07"

          url = f"https://graph.facebook.com/{version}/{username}"

          params = {
              "fields": "id,name",
              "access_token": token,
          }

          response = requests.get(
              url,
              params=params,
              timeout=30,
          )

          print()
          print("HTTP status:", response.status_code)

          try:
              data = response.json()
          except Exception:
              print("Facebook returned a non-JSON response.")
              print(response.text[:1000])
              raise SystemExit(0)

          print("Facebook response:")
          print(data)

          if response.ok:
              print()
              print("==============================================")
              print("RESULT: PROFILE RESOLVED")
              print("==============================================")
              print("Profile ID:", data.get("id"))
              print("Profile name:", data.get("name"))
              print()
              print("Meta allowed the current Page token to")
              print("resolve the supplied profile.")
          else:
              print()
              print("==============================================")
              print("RESULT: PROFILE NOT RESOLVED")
              print("==============================================")
              print(
                  "Meta did not allow the current Page token "
                  "to resolve this personal profile through "
                  "this Graph API request."
              )
              print()
              print(
                  "IMPORTANT: This does NOT prove that Facebook "
                  "Page tagging through the Facebook UI is impossible."
              )
              print(
                  "It only proves that this specific Graph API "
                  "lookup is not available with the current token."
              )

      - name: Final diagnostic summary
        if: always()
        run: |
          echo "=============================================="
          echo "FACEBOOK TAG DIAGNOSTIC"
          echo "=============================================="
          echo "Production workflow: NOT TOUCHED"
          echo "Production publishing: NOT RUN"
          echo "Facebook post created: NO"
          echo "Facebook comment created: NO"
          echo "Facebook like created: NO"
          echo "Facebook tag created: NO"
          echo "=============================================="
