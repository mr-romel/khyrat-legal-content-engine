name: Blogger Foundation Pages
on:
  push:
    branches: [main]
    paths:
      - ".github/BLOGGER_PAGES_RUN_NOW.md"
  schedule:
    - cron: "0 6 * * 1"
      timezone: "Africa/Cairo"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blogger-foundation-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Publish or update Blogger foundation pages through authenticated UI
        env:
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_OAUTH_JSON: ${{ secrets.BLOGGER_OAUTH_JSON }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          BLOGGER_UI_STORAGE_STATE_B64: ${{ secrets.BLOGGER_UI_STORAGE_STATE_B64 }}
        run: PYTHONPATH=src python src/blogger_pages_ui_worker.py
      - name: Configure and verify visible page navigation
        env:
          BLOGGER_ENABLED: ${{ secrets.BLOGGER_ENABLED || 'true' }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL || 'https://askmahmoudkhyrat.blogspot.com/' }}
          BLOGGER_UI_STORAGE_STATE_B64: ${{ secrets.BLOGGER_UI_STORAGE_STATE_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          BLOGGER_SITE_TITLE: "اسأل محمود | محمود خيرت - مستشار قانوني للشركات"
          BLOGGER_SITE_DESCRIPTION: "اسأل محمود؛ المنصة القانونية لمحمود خيرت رجب، المحامي والمستشار القانوني للشركات في مصر. شروحات عملية للعقود والعمل والشركات والمنازعات."
        run: PYTHONPATH=src python src/blogger_identity_worker.py
