name: Khyrat Evening Telegram Publishing Report

on:
  schedule:
    # Cairo is UTC+2 in winter and UTC+3 in summer. Run at both UTC
    # candidates and let the worker send only when Cairo local time is 22:xx.
    - cron: "0 19,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khyrat-evening-telegram-report
  cancel-in-progress: false

jobs:
  report:
    name: Verify today's platform outcomes and report to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
      - name: Send evening publishing outcome report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: Content
        run: PYTHONPATH=src python src/evening_telegram_report.py
