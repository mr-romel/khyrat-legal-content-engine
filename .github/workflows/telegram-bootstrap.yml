name: Telegram Bootstrap Helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Telegram chat and user IDs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN is missing")
          response = requests.get(
              f"https://api.telegram.org/bot{token}/getUpdates",
              params={"limit": 100, "timeout": 0},
              timeout=30,
          )
          data = response.json()
          if not response.ok or not data.get("ok"):
              raise SystemExit(str(data))
          seen = set()
          for update in data.get("result", []):
              message = update.get("message") or {}
              callback = update.get("callback_query") or {}
              user = message.get("from") or callback.get("from") or {}
              chat = message.get("chat") or (callback.get("message") or {}).get("chat") or {}
              user_id = user.get("id")
              chat_id = chat.get("id")
              key = (user_id, chat_id)
              if key in seen:
                  continue
              seen.add(key)
              print(f"TELEGRAM_ADMIN_USER_ID={user_id}")
              print(f"TELEGRAM_CHAT_ID={chat_id}")
          if not seen:
              print("No updates found. Open your bot in Telegram, press Start, send /start, then run this workflow again.")
          PY
