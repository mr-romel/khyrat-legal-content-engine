<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>خيرت — Marketplace Dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#20242a;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}header,section,.card{background:#fff;border:1px solid #dfe3e8;border-radius:15px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:#f8fafc;border-radius:10px;padding:13px}.stat b{display:block;font-size:25px;margin-top:5px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge,.score{background:#eef2f6;border-radius:999px;padding:5px 9px;font-size:12px;white-space:nowrap}.muted{color:#66717c;font-size:13px}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}button,.open{border:1px solid #cbd1d8;border-radius:8px;padding:9px 12px;background:#f7f8fa;color:#20242a;cursor:pointer;text-decoration:none;font:inherit}button.primary,.open.primary{background:#20242a;color:#fff}button.danger{background:#fff0f0}input,textarea{width:100%;padding:10px;border:1px solid #cbd1d8;border-radius:8px;margin-top:5px;font:inherit}textarea{min-height:150px;line-height:1.7;resize:vertical}label{display:block;margin-top:9px}.toolbar input{max-width:520px;margin:0}details{margin-top:10px}summary{cursor:pointer;font-weight:bold}#msg{position:fixed;bottom:18px;left:18px;background:#20242a;color:#fff;padding:11px 15px;border-radius:10px;display:none;z-index:5}.notice{background:#f8fafc;padding:12px;border-radius:8px;border-right:4px solid #20242a}.online{font-weight:bold}.empty{padding:20px;text-align:center;color:#68717c}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.items{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><header><h1>مركز متابعة سوق خدمات خيرت</h1><p class="muted">لوحة تشغيل ومراجعة للفرص والخدمات. البيانات المحلية محفوظة على الجهاز، ويمكن ربط اللوحة مباشرة بالـBackend المنشور.</p>
<div class="toolbar"><input id="apiBase" placeholder="رابط الـBackend — مثال: https://your-project.vercel.app"><button class="primary" onclick="connectBackend()">اختبار وربط الـBackend</button><button onclick="loadRemote()">تحديث من الـBackend</button><button onclick="resetState()">إرجاع بيانات البداية</button></div>
<div id="backend" class="notice">لم يتم اختبار Backend بعد. إذا كانت اللوحة على GitHub Pages، أدخل رابط Vercel هنا مرة واحدة.</div></header>
<div id="stats" class="grid"></div><section><input id="search" placeholder="بحث في الفرص والخدمات..." oninput="draw()"><div class="toolbar"><button onclick="syncMostaql()">سحب فرص جديدة من مستقل الآن</button></div></section><section><h2>فرص مستقل</h2><div id="opportunities" class="items"></div></section><section><h2>خدمات خمسات</h2><div id="services" class="items"></div></section><section><h2>Portfolio</h2><div id="portfolio" class="items"></div></section><section><h2>سجل النشاط</h2><ul id="activity"></ul></section></div><div id="msg"></div>
<script>
const ORIGINAL={"services": [], "opportunities": [{"id": "opp-discovery-398fb1b442d53bac", "platform": "mostaql", "title": "1275086 خبير قانوني لتدقيق ومراجعة عقود التجارة والامتثال لمنصة رقمية", "description": "\"نبحث عن استشاري قانوني متخصص في القانون التجاري الدولي وعقود الضمان (Escrow) لمراجعة وتدقيق الإطار القانوني وعقود الامتثال الخاصة بمنصة تجارية رقمية عابرة للحدود (B2B). المطلوب مراجعة نموذج عقود الضمان وشروط الامتثال التجاري.\" حالة المشروع مفتوح تاريخ النشر منذ يومين", "source_url": "https://mostaql.com/project/1275086-%D8%AE%D8%A8%D9%8A%D8%B1-%D9%82%D8%A7%D9%86%D9%88%D9%86%D9%8A-%D9%84%D8%AA%D8%AF%D9%82%D9%8A%D9%82-%D9%88%D9%85%D8%B1%D8%A7%D8%AC%D8%B9%D8%A9-%D8%B9%D9%82%D9%88%D8%AF-%D8%A7%D9%84%D8%AA%D8%AC%D8%A7%D8%B1%D8%A9-%D9%88%D8%A7%D9%84%D8%A7%D9%85%D8%AA%D8%AB%D8%A7%D9%84-%D9%84%D9%85%D9%86%D8%B5%D8%A9-%D8%B1%D9%82%D9%85%D9%8A%D8%A9", "discovery_score": 100, "live": true, "match_score": 85, "rationale": ["مطابقة مباشرة مع: عقود", "مطابقة مباشرة مع: قانون", "مطابقة مباشرة مع: مراجعة"], "suggested_price_egp": 1500, "suggested_days": 2, "status": "OFFER_READY", "offer": "أهلًا، اطلعت على طلبك، وأقدر أساعدك في المراجعة القانونية للمستند وتحليل البنود التي قد تسبب لك مخاطر أو التزامات غير واضحة.\n\nهراجع المستند بندًا بندًا، وأوضح أي نقاط تحتاج تعديل أو إعادة صياغة، مع تقديم البديل المقترح بشكل عملي وواضح. ولو فيه نقطة محتاجة تفاوض أو تستدعي الانتباه قبل التوقيع، هأشير إليها صراحة.\n\nهدفي إنك تخرج من المراجعة وأنت عارف بالضبط: إيه المشكلة؟ وإيه خطورتها؟ وإيه التعديل المناسب؟\n\nأقدر أبدأ فورًا، والمدة المتوقعة 2 أيام، والميزانية 1500 جنيه مصري كما هو محدد في العرض.\n\nلو أرسلت المستند أو التفاصيل الأساسية الخاصة بـخبير قانوني لتدقيق ومراجعة عقود التجارة والامتثال لمنصة رقمية، أبدأ بمراجعته وتحديد نطاق العمل بدقة قبل التنفيذ.", "source_kind": "mostaql_business_filter", "source_filter": "https://mostaql.com/projects/business", "acquisition_score": 94, "priority": "HIGH", "ranking_reasons": ["تخصص قانوني مناسب: عقود، مراجعة، قانوني، تجاري", "وصف المشروع واضح بما يكفي لبناء عرض مخصص"], "recommendation": "قدّم بعد مراجعة العرض والسعر", "suggested_price_usd": 20, "win_probability": 0.62, "expected_value_usd": 12.4, "lifecycle": "OFFER_READY", "created_at": "", "updated_at": ""}], "portfolio": [], "activity": []};let state=load();let API=localStorage.getItem('khyrat_marketplace_api')||'';document.getElementById('apiBase').value=API;
function load(){try{const x=JSON.parse(localStorage.getItem('khyrat_marketplace_state'));if(x&&Array.isArray(x.opportunities))return x}catch(e){}return structuredClone(ORIGINAL)}
function persist(message){state.activity=state.activity||[];if(message)state.activity.unshift({time:new Date().toLocaleString('ar-EG'),message});state.activity=state.activity.slice(0,100);localStorage.setItem('khyrat_marketplace_state',JSON.stringify(state));draw();toast(message)}
function find(id){return [...(state.opportunities||[]),...(state.services||[])].find(x=>String(x.id)===String(id))}
function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function status(x){return String(x.lifecycle||x.status||'DRAFT').toUpperCase()}
function card(x,isOpp){const id=esc(x.id),s=status(x),title=esc(x.title),desc=esc(x.description||x.summary||''),offer=esc(x.offer||''),score=Number(x.acquisition_score??x.match_score??0);let b='';if(['DRAFT','OFFER_READY','REJECTED','FAILED'].includes(s))b+=`<button onclick="transition('${id}','READY_FOR_REVIEW')">إرسال للمراجعة</button>`;if(s==='READY_FOR_REVIEW')b+=`<button onclick="transition('${id}','APPROVED')">اعتماد</button><button class="danger" onclick="transition('${id}','REJECTED')">رفض</button>`;if(isOpp&&s==='APPROVED')b+=`<button onclick="transition('${id}','SUBMITTED')">تسجيل كمُرسل</button>`;if(isOpp&&s==='SUBMITTED')b+=`<button onclick="transition('${id}','WON')">تسجيل فوز</button><button onclick="transition('${id}','LOST')">تسجيل خسارة</button><button onclick="transition('${id}','FOLLOW_UP')">تمت المتابعة</button>`;if(isOpp&&!['WON','LOST','EXPIRED','CANCELLED'].includes(s))b+=`<button onclick="regenerate('${id}')">إعادة توليد العرض محليًا</button>`;if(isOpp&&x.source_url)b+=`<a class="open" target="_blank" rel="noopener" href="${esc(x.source_url)}">فتح المشروع على مستقل</a>`;return `<article class="card"><div class="row"><strong>${title}</strong><span class="badge">${esc(s)}</span></div><p>${desc}</p>${isOpp?`<span class="score">${score}% أولوية</span><details open><summary>العرض</summary><textarea id="offer-${id}">${offer}</textarea><div class="actions"><button onclick="copyOffer('${id}')">نسخ العرض</button><button onclick="saveOffer('${id}')">حفظ العرض</button><button onclick="remoteOffer('${id}')">دراسة بـGemini</button></div></details>`:''}<details><summary>تعديل البيانات</summary><label>العنوان<input id="title-${id}" value="${title}"></label><label>الوصف<textarea id="desc-${id}">${desc}</textarea></label>${isOpp?`<label>السعر بالدولار<input id="price-${id}" type="number" min="5" step="5" value="${Number(x.suggested_price_usd||5)}"></label><label>المدة بالأيام<input id="days-${id}" type="number" min="1" value="${Number(x.suggested_days||3)}"></label>`:''}<button onclick="saveItem('${id}',${isOpp})">حفظ التعديل</button></details><div class="actions">${b}</div></article>`}
function draw(){const opp=state.opportunities||[],services=state.services||[];document.getElementById('stats').innerHTML=`<div class="stat">الخدمات<b>${services.length}</b></div><div class="stat">فرص مستقل<b>${opp.length}</b></div><div class="stat">للمراجعة<b>${opp.filter(x=>['READY_FOR_REVIEW','OFFER_READY'].includes(status(x))).length}</b></div><div class="stat">معتمدة/مرسلة<b>${opp.filter(x=>['APPROVED','SUBMITTED','WON'].includes(status(x))).length}</b></div>`;const q=(document.getElementById('search')?.value||'').toLowerCase().trim();const f=a=>a.filter(x=>(x.title+' '+(x.description||'')+' '+status(x)).toLowerCase().includes(q));document.getElementById('opportunities').innerHTML=f(opp).map(x=>card(x,true)).join('')||'<div class="empty">لا توجد فرص.</div>';document.getElementById('services').innerHTML=f(services).map(x=>card(x,false)).join('')||'<div class="empty">لا توجد خدمات.</div>';document.getElementById('portfolio').innerHTML=(state.portfolio||[]).map(x=>`<article class="card"><strong>${esc(x.title)}</strong><p>${esc(x.summary)}</p></article>`).join('')||'<div class="empty">لا توجد أعمال.</div>';document.getElementById('activity').innerHTML=(state.activity||[]).slice(0,30).map(x=>`<li>${esc(x.time)} — ${esc(x.message)}</li>`).join('')||'<li>لا يوجد نشاط.</li>'}
function transition(id,to){const x=find(id);if(!x)return;const allowed={READY_FOR_REVIEW:['DRAFT','OFFER_READY','REJECTED','FAILED'],APPROVED:['READY_FOR_REVIEW'],REJECTED:['READY_FOR_REVIEW'],SUBMITTED:['APPROVED'],WON:['SUBMITTED'],LOST:['SUBMITTED'],FOLLOW_UP:['SUBMITTED']};if(allowed[to]&&!allowed[to].includes(status(x)))return toast('الانتقال غير مسموح من الحالة الحالية');x.status=x.lifecycle=to;x.updated_at=new Date().toISOString();persist(`تم تغيير حالة ${id} إلى ${to}`)}
function saveItem(id,isOpp){const x=find(id);if(!x)return;const t=document.getElementById('title-'+id).value.trim(),d=document.getElementById('desc-'+id).value.trim();if(!t||!d)return toast('العنوان والوصف مطلوبان');x.title=t;x.description=d;if(isOpp){const p=Number(document.getElementById('price-'+id).value),days=Number(document.getElementById('days-'+id).value);if(p<5||p%5||days<1)return toast('السعر يجب أن يكون 5$ أو مضاعفاته والمدة يومًا على الأقل');x.suggested_price_usd=p;x.suggested_price_egp=p*50;x.suggested_days=days}persist(`تم حفظ تعديل ${id}`)}
function saveOffer(id){const x=find(id),el=document.getElementById('offer-'+id);if(!x||!el)return;if(!el.value.trim())return toast('العرض لا يمكن أن يكون فارغًا');x.offer=el.value.trim();x.status=x.lifecycle='OFFER_READY';persist(`تم حفظ العرض ${id}`)}
async function copyOffer(id){const x=find(id);if(!x)return;try{await navigator.clipboard.writeText(x.offer||'');toast('تم نسخ العرض')}catch(e){const el=document.getElementById('offer-'+id);el.focus();el.select();document.execCommand('copy');toast('تم نسخ العرض')}}
function regenerate(id){const x=find(id);if(!x)return;const p=x.suggested_price_egp||((x.suggested_price_usd||5)*50),days=x.suggested_days||3;x.offer=`أهلًا، اطلعت على طلبك وأقدر أساعدك في المراجعة القانونية للمستند وتحليل البنود والمخاطر المحتملة.

سأراجع المستند بندًا بندًا، أوضح نقاط المخاطر والالتزامات غير الواضحة، وأقترح صياغات عملية بديلة.

المدة المتوقعة: ${days} أيام. الميزانية المقترحة: ${p} جنيه مصري.`;x.status=x.lifecycle='OFFER_READY';persist(`تمت إعادة توليد العرض ${id}`)}
function resetState(){if(!confirm('سيتم حذف تعديلات هذا الجهاز وإرجاع بيانات البداية. هل تريد المتابعة؟'))return;localStorage.removeItem('khyrat_marketplace_state');state=structuredClone(ORIGINAL);draw();toast('تم إرجاع بيانات البداية')}
async function req(path,payload){if(!API)return null;const r=await fetch(API.replace(/\/$/,'')+path,{method:payload?'POST':'GET',headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||d.message||'Backend error');return d}
async function connectBackend(){API=document.getElementById('apiBase').value.trim().replace(/\/$/,'');if(!API)return toast('أدخل رابط Backend');try{const d=await req('/api/health');localStorage.setItem('khyrat_marketplace_api',API);document.getElementById('backend').innerHTML=`<span class="online">Backend متصل.</span> ${esc(d.persistence||'')} — Gemini: ${d.gemini_offers?'مفعل':'غير مفعل'} — Mostaql: ${d.live_mostaql?'متاح':'غير متاح'}`;toast('تم اختبار Backend بنجاح');await loadRemote()}catch(e){document.getElementById('backend').textContent='فشل الاتصال: '+e.message;toast(e.message)}}
async function loadRemote(){if(!API)return toast('اربط Backend أولًا');try{const d=await req('/api/state');state=d;localStorage.setItem('khyrat_marketplace_state',JSON.stringify(state));draw();toast('تم تحديث البيانات من Backend')}catch(e){toast('تعذر تحديث Backend: '+e.message)}}
async function remoteOffer(id){if(!API)return regenerate(id);try{const d=await req('/api/mostaql/offer',{id});const x=find(id);if(x){x.offer=d.offer;x.status=x.lifecycle='OFFER_READY';persist('تمت دراسة المشروع بواسطة Gemini')}}catch(e){toast(e.message)}}
async function syncMostaql(){if(!API)return toast('اربط Backend أولًا');try{const d=await req('/api/mostaql/sync',{limit:12});toast(d.message);await loadRemote()}catch(e){toast(e.message)}}
function toast(t){const e=document.getElementById('msg');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2500)}
draw();
</script></body></html>
